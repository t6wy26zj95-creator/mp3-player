<script>
/* Telegram Mini App: Telegram's script is loaded only when the page was really opened inside Telegram
   (it passes #tgWebApp... in the URL), so the home-screen app never waits on telegram.org. */
(function () {
  var inTg = /tgWebApp/.test(location.hash + location.search);
  try { inTg = inTg || !!sessionStorage.getItem("__telegram__initParams"); } catch (e) {}
  if (inTg) { document.documentElement.classList.add("tg"); document.write('<script src="https://telegram.org/js/telegram-web-app.js?63"><\/script>'); }
})();
</script>

:root{--ease:cubic-bezier(.22,1,.36,1);--dur:.4s}

/* ===== one idea: clear glass + the cover's own glow. Tilt only moves that glow (and the wallpaper a hair). ===== */
:root{--inset:10px;--glass-blur:blur(3px) saturate(150%) brightness(.92);--cw:114px;--art-x:24px}   /* --cw = prev+play+next width (3x34 + 2x6); cover (66px) is centred over that group */
.player-wrapper{background:linear-gradient(rgba(6,18,26,.13),rgba(6,18,26,.13)),var(--glass-bg)}
.bg-container{transform:scale(1.04);will-change:transform}   /* the tilt parallax is set inline by JS (a plain transform: the compositor moves it, nothing is restyled) */
/* the two soft glows behind the cover change every frame, but only in transform and opacity: on their own layers they are
   blurred once and then just moved and faded by the GPU instead of being re-blurred 30-60 times a second */
.art-bloom,.art-light{will-change:transform,opacity}
/* corner highlight: fixed size (px), so it no longer grows when the drawer opens; no tilt */
.player-wrapper::before{background:linear-gradient(135deg,rgba(255,255,255,.17) 0,rgba(255,255,255,.04) 90px,rgba(255,255,255,0) 170px)}
.player-wrapper::after{content:none}
.track-info-container{position:relative;align-items:center}
.album-art{width:66px;height:66px;box-sizing:border-box;border-radius:12px;margin-left:var(--art-x);position:relative;z-index:1}
.art-bloom{position:absolute;left:calc(var(--inset) + var(--art-x));top:2px;width:66px;height:66px;border-radius:12px;background-size:cover;background-position:center;
  filter:blur(20px) saturate(1.6);opacity:calc(.38 + var(--pulse,0) * .24);
  transform:translate3d(calc(var(--tx,0) * 12px),calc(var(--ty,0) * 12px),0) scale(calc(1.5 + var(--pulse,0) * .12));pointer-events:none}
/* every album cover gets a quiet static glow taken from its own artwork */
.album-card{isolation:isolate}
/* progress dot glows with the music */
.slider-thumb{box-shadow:0 2px 6px rgba(0,0,0,.4),0 0 calc(8px + var(--pulse,0) * 10px) calc(1px + var(--pulse,0) * 2px) rgba(255,255,255,calc(.5 + var(--pulse,0) * .3))}
/* glow was cut off by the scroll/drawer boxes: give it room inside them (layout stays put via matching negative margins) */
@supports (overflow:clip){.drawer-inner,#view-host{overflow-x:visible;overflow-y:clip}}
.albums-grid-container,.artist-scroll{margin:-14px -20px 0;padding-inline:20px;padding-top:14px}
.artist-scroll{padding-bottom:28px}
.albums-grid{padding-bottom:24px}

/* ===== glow layer: glows live outside the scrollers, are positioned by JS, and fade at the scroller's edges ===== */
#glow-layer{position:absolute;left:0;right:0;top:0;height:0;overflow:hidden;z-index:-1;pointer-events:none;opacity:0;transition:opacity .3s var(--ease);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%)}
#glow-layer.on{opacity:1}
#glow-layer.off .glow{opacity:0!important}
.glow{position:absolute;left:0;top:0;border-radius:14px;background-size:cover;background-position:center;filter:blur(15px) saturate(1.5);opacity:0;transition:opacity .4s var(--ease);will-change:transform}
.glow.in{opacity:.4}
.glow.in.dim{opacity:.16}
.glow.in.live{opacity:calc(.5 + var(--pulse,0) * .35);transition:none}

/* long titles: the drawer column may never grow past the panel; titles wrap to 2 lines instead of running off */
.collapsible-content{grid-template-columns:minmax(0,1fr)}
.drawer-inner,#view-host{min-width:0}
.item-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;white-space:normal;overflow:hidden;overflow-wrap:anywhere;line-height:1.25}

/* artist page: fixed viewport so the panel never resizes while data arrives; skeletons hold the space */
.artist-scroll{height:450px}
.artist-hero-img{opacity:0;transition:opacity .5s var(--ease)}
.artist-hero-img.ready{opacity:1}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));background-size:200% 100%;animation:skm 1.4s linear infinite;border-radius:12px}
@keyframes skm{to{background-position:-200% 0}}
.bio-sk{height:118px;margin:10px 4px 0}
.sk-card .sq{width:100%;aspect-ratio:1/1}
.sk-card .ln{width:60%;height:9px;border-radius:5px}
.fade-img{opacity:0}.fade-img.in{opacity:1}

/* cover light: soft wedge of artwork-picked colour circling behind the cover (GPU rotate only), energy-driven bloom */
.art-light{position:absolute;left:calc(var(--inset) + var(--art-x) - 22px);top:-20px;width:110px;height:110px;border-radius:50%;pointer-events:none;filter:blur(15px);
  background:conic-gradient(rgba(var(--lc,200,215,225),0) 0deg,rgba(var(--lc,200,215,225),.9) 50deg,rgba(var(--lc,200,215,225),0) 135deg,rgba(var(--lc2,200,215,225),0) 190deg,rgba(var(--lc2,200,215,225),.55) 245deg,rgba(var(--lc2,200,215,225),0) 320deg);
  transform:rotate(var(--ang,0deg));opacity:calc((.24 + var(--en,0) * .26 + var(--pulse,0) * .22 + var(--br,.5) * .05) * var(--lk,1))}
.art-bloom{opacity:calc(.32 + var(--en,0) * .06 + var(--pulse,0) * .22 + var(--br,.5) * .06);
  transform:translate3d(calc(var(--tx,0) * 12px),calc(var(--ty,0) * 12px),0) scale(calc(1.5 + var(--pulse,0) * .12 + var(--br,.5) * .05))}

/* ===== glass cover =====
   The artwork and every glass layer sit in ONE clipped box (.art-clip), so they share exactly the same outline:
   nothing of the artwork can show outside the rim any more. Light is driven by JS on #player-main:
   --la light direction (same one that turns the halo behind), --gx/--gy surface hotspot, --gi rim brightness,
   --gt tilt boost (0 without tilt), --sh reflection streak, --rx/--ry edge refraction shift.
   It moves on its own all the time; tilt (when enabled) only adds to it. */
.album-art{border:0;background:none;overflow:visible;
  box-shadow:0 7px 18px rgba(0,0,0,.32),0 2px 5px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.45)}
.art-clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden;clip-path:inset(0 round 12px);background:rgba(0,0,0,.22);
  display:flex;align-items:center;justify-content:center;isolation:isolate}
.art-clip img{display:block}
.g{position:absolute;inset:0;border-radius:inherit;pointer-events:none}
/* edge refraction: a thin band where the artwork looks magnified through the glass edge; shifts a hair with the light */
.g-refr{background:var(--art,none) calc(50% + var(--rx,0px)) calc(50% + var(--ry,0px))/107% 107% no-repeat;filter:saturate(1.35) brightness(1.14) blur(.4px);
  opacity:calc(var(--art-on,0) * .42);transition:opacity .3s ease;
  -webkit-mask-image:linear-gradient(90deg,#000,transparent 4px,transparent calc(100% - 4px),#000),linear-gradient(#000,transparent 4px,transparent calc(100% - 4px),#000);
          mask-image:linear-gradient(90deg,#000,transparent 4px,transparent calc(100% - 4px),#000),linear-gradient(#000,transparent 4px,transparent calc(100% - 4px),#000)}
/* thickness: the lower edge sits a little in shadow, the upper edge catches a little light */
.g-shade{box-shadow:inset 0 -12px 16px -14px rgba(0,0,0,.45),inset 0 11px 14px -14px rgba(255,255,255,.3)}
/* surface: a soft specular hotspot on the side the light comes from + a faint sky reflection at the top */
.g-spec{background:
  radial-gradient(62% 62% at var(--gx,32%) var(--gy,20%),rgba(255,255,255,calc(.19 * var(--gl,1) * (1 + .7 * var(--gt,0)))) 0,rgba(255,255,255,calc(.06 * var(--gl,1))) 34%,rgba(255,255,255,0) 70%),
  linear-gradient(168deg,rgba(255,255,255,.08) 0,rgba(255,255,255,.02) 38%,rgba(255,255,255,0) 52%)}
/* a long glass reflection (with a thin second line) that glides across now and then */
.g-streak{mix-blend-mode:screen;background:linear-gradient(112deg,rgba(255,255,255,0) 40%,rgba(255,255,255,calc(.13 * var(--gl,1) * (1 + var(--gt,0)))) 47%,rgba(255,255,255,.03) 50%,rgba(255,255,255,calc(.07 * var(--gl,1))) 53%,rgba(255,255,255,0) 57%) calc(var(--sh,.5) * 100%) 0/300% 100% no-repeat}
/* soft inner glow along the edge, brightest where the light hits, tinted with the artwork's colours */
.g-glow{background:conic-gradient(from var(--la,-40deg),
    rgba(255,255,255,calc(.16 + .3 * var(--gi,.6))) 0deg,rgba(var(--lc,200,215,225),calc(.1 + .22 * var(--gi,.6))) 40deg,rgba(255,255,255,0) 95deg,rgba(255,255,255,0) 150deg,
    rgba(var(--lc2,200,215,225),calc(.05 + .15 * var(--gi,.6))) 180deg,rgba(255,255,255,0) 210deg,rgba(255,255,255,0) 265deg,
    rgba(var(--lc,200,215,225),calc(.1 + .22 * var(--gi,.6))) 320deg,rgba(255,255,255,calc(.16 + .3 * var(--gi,.6))) 360deg);
  -webkit-mask-image:linear-gradient(90deg,#000,transparent 7px,transparent calc(100% - 7px),#000),linear-gradient(#000,transparent 7px,transparent calc(100% - 7px),#000);
          mask-image:linear-gradient(90deg,#000,transparent 7px,transparent calc(100% - 7px),#000),linear-gradient(#000,transparent 7px,transparent calc(100% - 7px),#000)}
/* the crisp glass rim: runs the whole perimeter, catches the light on one side and a weaker bounce on the other */
.g-rim{box-sizing:border-box;padding:1px;
  background:conic-gradient(from var(--la,-40deg),
    rgba(255,255,255,calc(.5 + .45 * var(--gi,.6))) 0deg,rgba(var(--lc,200,215,225),calc(.3 + .3 * var(--gi,.6))) 32deg,rgba(255,255,255,.18) 80deg,rgba(255,255,255,.13) 145deg,
    rgba(var(--lc2,200,215,225),calc(.18 + .3 * var(--gi,.6))) 180deg,rgba(255,255,255,.13) 215deg,rgba(255,255,255,.18) 280deg,
    rgba(var(--lc,200,215,225),calc(.3 + .3 * var(--gi,.6))) 328deg,rgba(255,255,255,calc(.5 + .45 * var(--gi,.6))) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}

/* ===== title spark =====
   No object travels across: the letters themselves glow. A copy of the title sits exactly on top of it, its text
   transparent, with a soft wide band of light clipped to the glyphs; a halo round that copy makes only the letters under
   the band glow. JS (Web Animations) slides the band across and fades it in and out; otherwise it's invisible. */
.track-text{padding:6px 0;margin:-6px 0}                            /* room for the letters' glow; layout unchanged */
.title-box{position:relative;min-width:0}
.track-title.title-glint{position:absolute;inset:0;pointer-events:none;opacity:0;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;
  background:linear-gradient(90deg,rgba(255,255,255,0) 0,rgba(255,255,255,.35) 25%,rgba(255,255,255,.9) 45%,#fff 50%,rgba(255,255,255,.9) 55%,rgba(255,255,255,.35) 75%,rgba(255,255,255,0) 100%) -120px 0/84px 100% no-repeat;
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 1.5px rgba(255,255,255,.9)) drop-shadow(0 0 6px rgba(var(--lc,200,215,225),.75))}

/* ===== inside Telegram (html.tg) =====
   No Safari toolbar to paint under, so the page is exactly the screen and never scrolls itself. In full-screen mode
   Telegram draws its Close / ⋯ pills over the top of the page: --tg-content-safe-area-inset-top keeps the player below them. */
html.tg{height:100%;overflow:hidden;overscroll-behavior:none}
html.tg .bg-container,html.tg .bg-vignette{height:100%}
html.tg body{--tg-top:max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px));--tg-bot:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
  padding-top:calc(var(--tg-top) + var(--tg-content-safe-area-inset-top,0px) + 16px);overscroll-behavior:none}
html.tg .gear-btn{bottom:calc(var(--tg-bot) + 20px)}
html.tg .floating-customizer{bottom:calc(var(--tg-bot) + 74px)}
html.tg .toast{bottom:calc(var(--tg-bot) + 84px)}

/* ===== Queue =====
   History (dimmed) above, the song playing now, then the queue (drag the handle to reorder). */
#queue-wrapper{max-height:none}
.queue-container{position:relative;max-height:300px;margin:-10px -20px 0;padding:10px 20px 6px}
.q-sec{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:26px;font:600 11px -apple-system,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.5);padding:12px 12px 4px}
.q-sec:first-child{padding-top:2px}
.q-sec span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-sec button{flex-shrink:0;background:none;border:0;color:rgba(255,255,255,.65);font:inherit;letter-spacing:inherit;cursor:pointer;padding:4px 0}
.q-sec button:active{color:#fff}
.q-fg{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:background .22s var(--ease)}
.q-fg:active{background:rgba(255,255,255,.08)}
.q-row.hist .q-fg{opacity:.5}
.q-row.now .q-fg{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.1);cursor:default}
.q-handle{width:30px;height:30px;margin-right:-6px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;flex-shrink:0}
.q-handle svg{width:16px;height:16px;fill:rgba(255,255,255,.45)}
/* the held row: a glass card lit by its own cover (same idea as the album glow). Everything fades in and out, nothing
   switches: the card's glass is a layer under the row's content whose opacity animates, the cover glow grows in on
   pick-up and fades on drop. */
.q-row[data-group] .q-fg{isolation:isolate}
.q-row[data-group] .q-fg::before{content:'';position:absolute;inset:-1px;border-radius:13px;pointer-events:none;z-index:-1;opacity:0;transition:opacity .24s var(--ease);
  background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.07) 55%,rgba(255,255,255,.04)),rgba(19,54,68,.98);
  border:1px solid rgba(255,255,255,.16);border-top-color:rgba(255,255,255,.4);box-sizing:border-box;
  box-shadow:0 14px 30px rgba(0,0,0,.32),0 3px 8px rgba(0,0,0,.18),inset 0 0 2px rgba(255,255,255,.25)}
.q-row.lifted .q-fg::before{opacity:1}
.q-row .item-art{transition:transform .26s var(--ease),box-shadow .26s var(--ease)}
.q-row .q-handle svg{transition:fill .2s ease}
.q-row.lifted,.q-row.landing{z-index:5;overflow:visible}
.q-row.lifted::after,.q-row.landing::after{content:'';position:absolute;inset:6px 18px;border-radius:14px;background:var(--art,rgba(255,255,255,.2)) center/cover;
  filter:blur(18px) saturate(1.7);z-index:-1;pointer-events:none}
.q-row.lifted::after{animation:qglow .3s var(--ease) both}
.q-row.landing::after{animation:qglowOut .28s var(--ease) both}
@keyframes qglow{from{opacity:0;transform:scale(.8)}to{opacity:.5;transform:none}}
@keyframes qglowOut{from{opacity:.5}to{opacity:0;transform:scale(.9)}}
.q-row.lifted .item-art{transform:scale(1.08);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.q-row.lifted .q-handle svg{fill:#fff}
.queue-container .q-row{transition:opacity .22s ease}
.queue-container.dragging .q-row:not(.lifted){opacity:.5}
.queue-container.dragging{-webkit-overflow-scrolling:auto}
.q-row.collapse{overflow:hidden;transition:height .22s var(--ease),opacity .22s var(--ease)}
.q-more{font-size:11px;color:rgba(255,255,255,.4);text-align:center;padding:10px 0 4px}
.q-link{display:block;width:100%;background:none;border:0;cursor:pointer;color:rgba(255,255,255,.6);font-weight:600}
.q-empty{font-size:12px;color:rgba(255,255,255,.4);text-align:center;padding:14px 12px}
/* swipe rows (Library and Queue): the row slides left over an action strip */
.sw{position:relative;border-radius:12px;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sw-fg{position:relative;will-change:transform}
.sw-bg{position:absolute;top:1px;bottom:1px;right:0;width:0;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:flex-end;
  background:rgba(var(--tone,255,255,255),.07);transition:background .18s ease}
.sw:not([data-stage="0"])[data-stage] .sw-bg{background:rgba(var(--tone),.34)}
.sw-lab{display:flex;flex-direction:row-reverse;align-items:center;gap:6px;padding:0 14px;white-space:nowrap;color:#fff;font:600 12px -apple-system,system-ui,sans-serif;transition:opacity .15s ease}
.sw-lab svg{width:18px;height:18px;fill:#fff;flex-shrink:0}
.sw-lab span{opacity:0;transition:opacity .14s ease}
.sw-lab.fit span{opacity:1}
.sw-lab.pop{animation:swpop .24s var(--ease)}
@keyframes swpop{0%{transform:scale(.82)}60%{transform:scale(1.07)}100%{transform:none}}

/* ===== touch + motion =====
   Presses are Web Animations on the separate `scale` property, so they never fight a transform (breathing, layout).
   Player buttons also light up where the finger lands (--px/--py, --hl fades out after release). */
@property --hl{syntax:'<number>';inherits:false;initial-value:0}
.player-btn:active,.circle-btn:active,.chip:active{transform:none}
.player-btn{position:relative;--hl:0;
  background:radial-gradient(circle at var(--px,50%) var(--py,50%),rgba(255,255,255,calc(var(--hl) * .4)),rgba(255,255,255,0) 72%),rgba(255,255,255,.1);
  transition:--hl .6s var(--ease),color .22s var(--ease),border-color .22s var(--ease),opacity .22s var(--ease)}
.player-btn:active{background:radial-gradient(circle at var(--px,50%) var(--py,50%),rgba(255,255,255,calc(var(--hl) * .4)),rgba(255,255,255,0) 72%),rgba(255,255,255,.16)}
.player-btn.pressed{--hl:1;transition-duration:.06s}
.player-btn svg{position:relative;z-index:1}
/* the three controls breathe with the music (--bp, set per button by the glow loop: Play leads, the sides follow a beat
   later); when paused, Play keeps a slow breath of its own. The glow is tinted with the cover's colour. */
.controls-cluster .player-btn,.controls-cluster .player-btn:active,.xp-ctrls .player-btn:not(.xp-tog){
  transform:scale(calc(1 + var(--bp,0) * var(--bs,.035)));
  border-color:rgba(255,255,255,calc(.15 + var(--bp,0) * .22));
  box-shadow:0 2px 5px rgba(0,0,0,.2),0 0 calc(2px + var(--bp,0) * 13px) rgba(var(--lc,200,215,225),calc(var(--bp,0) * .42)),inset 0 0 calc(1px + var(--bp,0) * 5px) rgba(255,255,255,calc(.04 + var(--bp,0) * .2))}
#play-btn{--bs:.06}
/* Play: a comet of light travels round the rim (the whole element rotates; the conic tail + a soft face highlight) */
.pb-shine{position:absolute;inset:-2px;border-radius:50%;pointer-events:none;opacity:0;
  filter:drop-shadow(0 0 2px rgba(255,255,255,.9)) drop-shadow(0 0 6px rgba(var(--lc,200,215,225),.9))}
.pb-comet{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(rgba(255,255,255,0) 0deg,rgba(255,255,255,0) 205deg,rgba(var(--lc,200,215,225),.5) 285deg,rgba(255,255,255,.95) 348deg,#fff 355deg,rgba(255,255,255,0) 360deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.2px),#000 calc(100% - 1.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.2px),#000 calc(100% - 1.5px))}
.pb-face{position:absolute;inset:3px;border-radius:50%;background:radial-gradient(60% 50% at 46% 0,rgba(255,255,255,.26),rgba(255,255,255,0) 72%)}
/* Play: hold for shuffle fills a thin ring just outside the button */
.pb-hold{position:absolute;inset:-5px;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .16s ease;
  background:conic-gradient(#fff calc(var(--hp,0) * 360deg),rgba(255,255,255,.16) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.6px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.6px),#000 calc(100% - 2px))}
.pb-hold.on{opacity:1}
/* song change: the old title/artist leave as a copy while the new ones slide in */
.tt-ghost{position:absolute;margin:0!important;pointer-events:none;z-index:2}
/* ...and the cover light flares for a moment (--fl, decays in the glow loop) */
.art-light{opacity:calc((.24 + var(--en,0) * .26 + var(--pulse,0) * .22 + var(--br,.5) * .05 + var(--fl,0) * .45) * var(--lk,1) * var(--hm,1));
  transform:rotate(var(--ang,0deg)) scale(calc(1 + var(--fl,0) * .18))}
.art-bloom{opacity:calc((.32 + var(--en,0) * .06 + var(--pulse,0) * .22 + var(--br,.5) * .06 + var(--fl,0) * .22) * var(--hm,1));
  transform:translate3d(calc(var(--tx,0) * 12px),calc(var(--ty,0) * 12px),0) scale(calc(1.5 + var(--pulse,0) * .12 + var(--br,.5) * .05 + var(--fl,0) * .22))}
/* Liquid Glass tab slider: position via `translate`, stretch via width, squash via transform, pop in/out via `scale` */
.tab-buttons{position:relative;gap:24px}
@media (max-width:370px){.tab-buttons{gap:18px}}
@media (max-width:340px){.tab-buttons{gap:12px}}
.tab-buttons .tab-btn{position:relative;z-index:1}
.tab-pill{position:absolute;left:0;top:50%;height:28px;margin-top:-14px;width:0;border-radius:999px;pointer-events:none;z-index:0;box-sizing:border-box;
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06)),rgba(255,255,255,calc(.05 + var(--pv,0) * .07));
  border:1px solid rgba(255,255,255,.2);border-top-color:rgba(255,255,255,.46);
  backdrop-filter:blur(10px) saturate(170%);-webkit-backdrop-filter:blur(10px) saturate(170%);
  box-shadow:0 4px 14px rgba(0,0,0,.22),inset 0 0 2px rgba(255,255,255,.3),0 0 calc(var(--pv,0) * 16px) rgba(var(--lc,200,215,225),calc(var(--pv,0) * .5));
  opacity:0;scale:.55;transition:opacity .22s var(--ease),scale .5s cubic-bezier(.34,1.56,.64,1)}
.tab-pill.on{opacity:1;scale:1}
/* ===== Liquid Bubble theme (html.bubble) =====
   The panel's own glass, border and corner highlight step aside. Three layers behind the content, all exactly the panel's
   rounded rectangle (the whole panel moves as one; its edge never bends):
   .bubble-skin  the glass itself: the real backdrop blur + tint, so it matches any wallpaper exactly
   .bubble-gl    Liquid Glass edge (WebGL): the wallpaper bent inside a thin bevel ring + the bevel's highlights; fades in
   .bubble-svg   a simple rim and inner light, used until (or instead of, without WebGL) the edge is ready */
.bubble-skin,.bubble-svg,.bubble-gl{position:absolute;left:-1px;top:-1px;width:calc(100% + 2px);height:calc(100% + 2px);pointer-events:none;z-index:-1;display:none;border-radius:36px}   /* explicit size: a canvas would otherwise take its pixel size */
html.bubble .bubble-skin,html.bubble .bubble-svg,html.bubble .bubble-gl{display:block}
.bubble-gl{opacity:0;transition:opacity .7s var(--ease)}
.bubble-svg{transition:opacity .7s var(--ease)}
html.bubble.gl-glass .bubble-gl{opacity:1}
html.bubble.gl-glass .bubble-svg{opacity:0}
.bubble-skin{background:linear-gradient(rgba(6,18,26,.1),rgba(6,18,26,.1));   /* clear glass: a light blur and a faint tint, no milky sheen */
  backdrop-filter:blur(2px) saturate(135%) brightness(.94);-webkit-backdrop-filter:blur(2px) saturate(135%) brightness(.94)}
.bubble-svg{overflow:visible;border-radius:0}
/* once the WebGL glass has faded in it draws the whole glass (blur and tint included), so the CSS backdrop blur beneath it
   is switched off. A backdrop blur is recomputed over the whole panel every time anything inside the panel repaints
   (the cover light, the glow, the progress dot...), many times a second; the WebGL glass is redrawn only when the
   wallpaper or the panel itself moves. */
html.bubble.gl-solid .bubble-skin{backdrop-filter:none;-webkit-backdrop-filter:none;background:none}
html.bubble .player-wrapper{background:transparent;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:36px;
  box-shadow:0 22px 50px rgba(0,0,0,.26),0 5px 16px rgba(0,0,0,.13);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
html.bubble .player-wrapper::before{display:none}
html.bubble body{touch-action:none}                                /* a pull that starts just outside the panel must not scroll the page */
html.bubble .player-wrapper :is(.playlist-container,.queue-container,.albums-grid-container,.artist-scroll){touch-action:pan-y}
/* Settings: switch row */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:rgba(255,255,255,.75)}
.set-row small{display:block;font-size:10px;color:rgba(255,255,255,.4);margin-top:2px}
/* Settings: "More" tucks away rarely used options */
.more-toggle{display:flex;align-items:center;justify-content:center;gap:2px;align-self:center;background:none;border:0;color:rgba(255,255,255,.4);font:500 11px -apple-system,system-ui,sans-serif;padding:2px 8px;cursor:pointer}
.more-toggle svg{width:14px;height:14px;fill:currentColor;transition:transform .3s var(--ease)}
.more-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.more-box{padding-top:2px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
.more-box[hidden]{display:none}
.switch{position:relative;width:46px;height:28px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);padding:0;cursor:pointer;flex-shrink:0;
  transition:background .3s var(--ease),border-color .3s var(--ease)}
.switch i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:999px;background:linear-gradient(#fff,#e3ecf0);box-shadow:0 2px 6px rgba(0,0,0,.35);
  transition:translate .45s cubic-bezier(.34,1.56,.64,1),width .22s var(--ease)}

.switch[aria-checked="true"]{background:rgba(88,196,178,.55);border-color:rgba(160,240,225,.5)}
.switch[aria-checked="true"] i{translate:18px 0}
.switch[aria-checked="true"]:active i{translate:13px 0}
.tab-pill::after{content:'';position:absolute;left:7px;right:7px;top:1px;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0))}

/* ===== Expanded player (.xp) =====
   One layer over the panel's own content. The compact rows stay where they are (hidden once expanded), so switching
   back is exact. While the finger moves, JS drives everything from one number p (0 = compact, 1 = expanded): the panel's
   height, the big cover (scaled down onto the small cover at p = 0), the title and the fades. The top part is anchored
   to the panel's top and the bottom part (Up next) to its bottom, so nothing reflows while it grows. */
.album-art,.xp-art,.xp-handle,.xp{touch-action:none}
.xp .xp-strip{touch-action:pan-x}
.album-art{cursor:pointer}
/* not clipped to the panel: the cover's glow spreads past the glass edge, exactly like the small cover's does (clipping it
   cut the glow off in a straight line the moment the big cover took over) */
.xp{position:absolute;inset:0;z-index:3;display:none;border-radius:inherit;pointer-events:none}
.xp.show{display:block}
.player-wrapper.xp-on .xp{pointer-events:auto}
.player-wrapper.xp-on>#player-main,.player-wrapper.xp-on>#controls-main,.player-wrapper.xp-on>#footer-main{visibility:hidden}
.player-wrapper.xp-anim>#player-main,.player-wrapper.xp-anim>#controls-main,.player-wrapper.xp-anim>#footer-main{pointer-events:none}
.xp-top{position:absolute;left:0;right:0;top:0;padding:6px 22px 0;display:flex;flex-direction:column}
.xp-handle{align-self:center;width:72px;height:20px;background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.xp-handle i{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.38)}
.xp-slot{position:relative;width:var(--xs,280px);height:var(--xs,280px);margin:10px auto 0;flex-shrink:0}
.xp-art{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;border-radius:18px;will-change:transform;cursor:grab}
.xp-clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;isolation:isolate;
  box-shadow:0 18px 40px rgba(0,0,0,.34),0 4px 12px rgba(0,0,0,.2)}
.xp-clip img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.xp-clip svg{width:26%;height:26%;fill:rgba(255,255,255,.4)}
/* The big cover wears exactly the small cover's effects (glow behind, circling light, glass layers), driven by the same
   values, so nothing switches off while it grows or once it's open. Its box is S px at rest and is scaled down onto the
   66 px cover at p = 0, so sizes are written in the small cover's px times a factor:
   --k = S / 66 (glows: they stay in proportion to the cover), --u = set per frame by the expansion (fine details: at
   p = 0 it equals --k, so both covers match to the pixel; open, the rim and edge bands are 1.6x the small cover's). */
/* The cover glow (both covers): bitmaps drawn once per song (coverGlow, in the script), never a CSS blur, so nothing is
   re-blurred while the cover grows and the small and big covers show the very same image.
   - bloom: a soft colour field from the artwork's colours (blobs sampled round its edge, on a round falloff): ambient
     light, not a blurred copy of the picture. Canvas = 194 units: the 66 px cover plus 64 each side, centred on it.
   - light: the two-colour wedge circling behind the cover. Canvas = 180 units (a 110 circle + 35 each side). */
#art-bloom,#art-light{filter:none;background:none;border-radius:0}
#art-bloom{left:calc(var(--inset) + var(--art-x) - 64px);top:-62px;width:194px;height:194px}
#art-light{left:calc(var(--inset) + var(--art-x) - 57px);top:-55px;width:180px;height:180px}
/* text and controls paint above the glow (it's an absolutely placed layer, which would otherwise draw over them) */
.track-text:not(.tt-ghost),.progress-container,.player-footer,.xp-meta,.xp-scrub,.xp-ctrls{position:relative;z-index:2}
.xp-art .art-bloom{left:-96.97%;top:-96.97%;width:293.94%;height:293.94%;border-radius:0;filter:none;background:none}
.xp-art .art-light{left:-86.364%;top:-86.364%;width:272.727%;height:272.727%;border-radius:0;filter:none;background:none}
#art-bloom,.xp-art .art-bloom{
  opacity:calc((.5 + var(--en,0) * .1 + var(--pulse,0) * .25 + var(--br,.5) * .08 + var(--fl,0) * .2) * var(--hm,1));
  transform:translate3d(calc(var(--tx,0) * 10px * var(--k,1)),calc(var(--ty,0) * 10px * var(--k,1)),0) scale(calc(1 + var(--pulse,0) * .07 + var(--br,.5) * .04 + var(--fl,0) * .1))}
.xp-clip .g-refr{background-position:calc(50% + var(--rx,0px) * var(--u,1)) calc(50% + var(--ry,0px) * var(--u,1));filter:saturate(1.35) brightness(1.14) blur(calc(.4px * var(--u,1)));
  -webkit-mask-image:linear-gradient(90deg,#000,transparent calc(4px * var(--u,1)),transparent calc(100% - 4px * var(--u,1)),#000),linear-gradient(#000,transparent calc(4px * var(--u,1)),transparent calc(100% - 4px * var(--u,1)),#000);
          mask-image:linear-gradient(90deg,#000,transparent calc(4px * var(--u,1)),transparent calc(100% - 4px * var(--u,1)),#000),linear-gradient(#000,transparent calc(4px * var(--u,1)),transparent calc(100% - 4px * var(--u,1)),#000)}
.xp-clip .g-shade{box-shadow:inset 0 calc(-12px * var(--u,1)) calc(16px * var(--u,1)) calc(-14px * var(--u,1)) rgba(0,0,0,.45),inset 0 calc(11px * var(--u,1)) calc(14px * var(--u,1)) calc(-14px * var(--u,1)) rgba(255,255,255,.3)}
.xp-clip .g-glow{-webkit-mask-image:linear-gradient(90deg,#000,transparent calc(7px * var(--u,1)),transparent calc(100% - 7px * var(--u,1)),#000),linear-gradient(#000,transparent calc(7px * var(--u,1)),transparent calc(100% - 7px * var(--u,1)),#000);
          mask-image:linear-gradient(90deg,#000,transparent calc(7px * var(--u,1)),transparent calc(100% - 7px * var(--u,1)),#000),linear-gradient(#000,transparent calc(7px * var(--u,1)),transparent calc(100% - 7px * var(--u,1)),#000)}
.xp-clip .g-rim{padding:calc(1px * var(--u,1))}
/* long names wrap instead of being cut: the title takes up to 3 lines (20 px for 1-2 lines, a bit smaller when it needs
   a 3rd, see fitTitle), the artist · album line up to 2. Past that, "…": a protection for absurdly long names. Words
   longer than the line (no spaces) break anywhere instead of running off. */
.xp-meta{margin-top:22px;transform-origin:0 0;min-width:0;width:100%;align-self:center;text-align:center}
.xp-title{font-size:var(--tfs,20px);font-weight:700;line-height:1.25;overflow:hidden;overflow-wrap:anywhere;text-wrap:balance;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;text-shadow:0 2px 6px rgba(0,0,0,.45)}
.xp-sub{margin-top:5px;font-size:13.5px;line-height:1.3;color:rgba(255,255,255,.55);overflow:hidden;overflow-wrap:anywhere;text-wrap:balance;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.xp-artist{color:rgba(255,255,255,.85);cursor:pointer}
.xp-scrub{margin-top:24px}
.xp-scrub .custom-range-slider{height:4px;border-radius:3px}
.xp-times{display:flex;justify-content:space-between;margin-top:9px;font-size:11px;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.xp-ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:0 4px}
.xp-ctrls .player-btn{width:46px;height:46px}
.xp-ctrls .player-btn svg{width:20px;height:20px}
.xp-ctrls #xp-play{width:60px;height:60px}
.xp-ctrls #xp-play svg{width:26px;height:26px}
.xp-ctrls .xp-tog{width:40px;height:40px;background-color:transparent;border-color:transparent;box-shadow:none;color:rgba(255,255,255,.55)}
.xp-ctrls .xp-tog:active{background-color:rgba(255,255,255,.1)}
.xp-ctrls .xp-tog svg{width:20px;height:20px}
.xp-tog.on{color:rgb(120,222,202)}
.xp-tog::after{content:'';position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:0;transition:opacity .25s var(--ease)}
.xp-tog.on::after{opacity:1}
.xp-bottom{position:absolute;left:0;right:0;bottom:0;padding:0 0 12px}
.xp-next-h{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;height:24px;padding:0 20px;font:600 11px -apple-system,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.5);pointer-events:none}
.xp-next-h span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp-next-h button{pointer-events:auto;flex-shrink:0;background:none;border:0;color:rgba(255,255,255,.7);font:inherit;letter-spacing:inherit;padding:6px 0 6px 12px;cursor:pointer}
/* the strip reaches up under its heading (transparent), so a card pulled up to remove isn't cut off straight away */
.xp-strip{position:relative;z-index:1;display:flex;align-items:center;gap:8px;overflow-x:auto;overflow-y:hidden;margin-top:-26px;padding:34px 20px 10px;min-height:52px;
  scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent)}
.xp-strip::-webkit-scrollbar{display:none}
.xp-strip.dragging{overflow-x:hidden}
.xp-card{position:relative;flex:0 0 138px;height:52px;display:flex;align-items:center;gap:8px;padding:0 10px 0 6px;box-sizing:border-box;border-radius:14px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  transition:background .22s var(--ease),border-color .22s var(--ease),opacity .22s ease}
.xp-card:active{background:rgba(255,255,255,.14)}
.xp-card.q::before{content:'';position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:rgb(88,196,178);box-shadow:0 0 6px rgba(88,196,178,.8)}
.xp-card-art{width:38px;height:38px;border-radius:9px;overflow:hidden;flex-shrink:0;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center}
.xp-card-art img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.xp-card-art svg{width:14px;height:14px;fill:rgba(255,255,255,.35)}
.xp-card-t{min-width:0;flex:1}
.xp-card-title{font-size:12px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.xp-card-artist{font-size:10.5px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.xp-card.lifted{z-index:5;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.06)),rgba(19,54,68,.96);border-color:rgba(255,255,255,.3);box-shadow:0 12px 26px rgba(0,0,0,.35)}
.xp-strip.dragging .xp-card:not(.lifted){opacity:.55}
.xp-card.rm{background:rgba(255,99,99,.42);border-color:rgba(255,150,150,.55)}
.xp-div{flex:0 0 1px;align-self:stretch;margin:6px 2px;background:rgba(255,255,255,.14)}
.xp-card.past{opacity:.45;filter:grayscale(.85)}
.xp-card.now{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.34);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 4px 14px rgba(0,0,0,.25);cursor:default}
.xp-empty{font-size:12px;color:rgba(255,255,255,.42);padding:0 2px;white-space:nowrap}
.gear-btn{transition:opacity .25s var(--ease)}
/* ---- big player pages: Lyrics | Player (home) | Albums ----
   The home page isn't clipped (the cover glow spreads past the glass); while pages slide it is clipped to the panel.
   The other pages live in a clipped box the size of the panel. The two-blob switch sits under the panel. */
.xp-home{position:absolute;inset:0}
.xp-side{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none;visibility:hidden}
.xp-side.on{visibility:visible}
.player-wrapper.xp-on .xp-side.on{pointer-events:auto}
.xp-page{position:absolute;inset:0;display:flex;flex-direction:column;will-change:transform}
.xp-nav{position:absolute;left:50%;top:calc(100% + 14px);display:flex;gap:2px;padding:3px;border-radius:999px;transform:translateX(-50%);opacity:0;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);box-shadow:0 6px 18px rgba(0,0,0,.25);
  backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%)}
.xp-nav button{position:relative;z-index:1;height:30px;padding:0 15px;border:0;background:none;border-radius:999px;color:rgba(255,255,255,.62);
  font:600 12.5px -apple-system,system-ui,sans-serif;letter-spacing:.2px;cursor:pointer;transition:color .25s var(--ease)}
.xp-nav button.on{color:#fff}
.xp-nav-lit{position:absolute;left:0;top:3px;height:30px;border-radius:999px;pointer-events:none;opacity:0;transform-origin:0 50%;
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.12));box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 2px 8px rgba(0,0,0,.2)}
/* lyrics */
.lyr-head{display:flex;align-items:center;gap:12px;padding:22px 20px 10px;flex-shrink:0}
.lyr-art{width:46px;height:46px;border-radius:10px;flex-shrink:0;background:rgba(255,255,255,.08) center/cover no-repeat;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.lyr-meta{min-width:0;flex:1}
.lyr-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyr-artist{font-size:12.5px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.lyr-play{width:40px;height:40px;flex-shrink:0}
.lyr-play svg{width:18px;height:18px}
.lyr-scroll{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(transparent 0,#000 28px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(transparent 0,#000 28px,#000 calc(100% - 40px),transparent)}
.lyr-scroll::-webkit-scrollbar{display:none}
.lyr-list{padding:18px 22px 45%}
/* lines change only in opacity and size (both drawn by the GPU). A blur and a coloured glow that changed with the
   current line left purple streaks behind on iPhone (the edges of the glow's redrawn area). */
.lyr-line{font-size:23px;font-weight:700;line-height:1.28;margin:0 0 14px;color:#fff;opacity:.32;transform-origin:0 50%;cursor:pointer;
  overflow-wrap:anywhere;transition:opacity .45s var(--ease),transform .45s var(--ease)}
.lyr-line.past{opacity:.22}
.lyr-line.on{opacity:1;transform:scale(1.03)}
.lyr-line.gap{font-size:20px;letter-spacing:4px}
.lyr-plain .lyr-line{opacity:.85;cursor:default;font-size:20px}
.lyr-note{font-size:14px;color:rgba(255,255,255,.55);line-height:1.45;padding-top:30px;text-align:center}
.lyr-credit{font-size:10.5px;color:rgba(255,255,255,.35);margin-top:26px}
/* albums page: a grid of your albums; one album: its songs */
.alb-head{display:flex;align-items:center;gap:8px;padding:22px 20px 8px;flex-shrink:0;min-height:42px}
.alb-back{width:34px;height:34px;margin-left:-8px;border:0;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.alb-back svg{width:22px;height:22px;fill:#fff}
.alb-back[hidden],.alb-play[hidden]{display:none}
.alb-h{min-width:0;flex:1}
.alb-title{font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alb-sub{font-size:12.5px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.alb-sub:empty{display:none}
.alb-play{display:flex;align-items:center;gap:4px;height:32px;padding:0 13px 0 9px;border:0;border-radius:999px;flex-shrink:0;cursor:pointer;
  background:rgba(255,255,255,.14);color:#fff;font:600 13px -apple-system,system-ui,sans-serif}
.alb-play svg{width:16px;height:16px;fill:#fff}
.alb-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(transparent 0,#000 14px,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(transparent 0,#000 14px,#000 calc(100% - 26px),transparent)}
.alb-scroll::-webkit-scrollbar{display:none}

.alb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 12px}
.alb-card{min-width:0;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .2s var(--ease)}
.alb-card:active{transform:scale(.95)}
.alb-cov{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;background:rgba(255,255,255,.07);box-shadow:0 6px 16px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center}
.alb-cov img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.alb-cov svg{width:34%;height:34%;fill:rgba(255,255,255,.4)}
.alb-card.now .alb-cov{box-shadow:0 0 0 2px rgba(255,255,255,.8),0 6px 16px rgba(0,0,0,.28)}
.alb-name{font-size:12px;font-weight:600;line-height:1.25;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}

.alb-empty{font-size:14px;color:rgba(255,255,255,.55);text-align:center;padding-top:30px}
/* Library / Artists / Queue opened from the expanded player: the lists grow to fill the tall panel (a sheet under the
   now-playing row); closing the section brings the big player back */
.player-wrapper.sheet :is(.playlist-container){max-height:var(--sheet-h,240px)}
.player-wrapper.sheet :is(.albums-grid-container,.queue-container){max-height:calc(var(--sheet-h,240px) + 44px)}

<script>
const $ = id => document.getElementById(id);
var XP = null;                                        // the expanded player (set further down); earlier code only calls it through `XP && ...`

/* ---------- TELEGRAM ----------
   TG is Telegram's Mini App object when the player runs inside Telegram, and null everywhere else (Safari, the home-screen
   app), so every Telegram-only line below is skipped outside it. tgAt(v) = "this Telegram app supports Bot API v". */
const TG = (() => { const w = window.Telegram && window.Telegram.WebApp; return w && w.platform && w.platform !== "unknown" ? w : null; })();
const tgAt = v => { try { return !!TG && TG.isVersionAtLeast(v); } catch (e) { return false; } };
/* Bot library: inside Telegram the songs are the ones you sent the bot, listed and streamed by your server.
   In the browser / home-screen app nothing changes: songs come from the phone's file picker. */
const APP_VERSION = "v32";                                        // shown while loading: tells which copy of the player is running
const API_BASE = "https://macawp3.duckdns.org";
let botMode = !!TG && !!TG.initData;                   // switches off if the server can't be reached, so the phone's files still work
function haptic(kind) {                               // "light" | "medium" | "select". Telegram's haptics also work on iPhone; navigator.vibrate is the fallback (Android browsers)
  if (tgAt("6.1")) { try { kind === "select" ? TG.HapticFeedback.selectionChanged() : TG.HapticFeedback.impactOccurred(kind); } catch (e) {} return; }
  if (kind !== "select" && navigator.vibrate) navigator.vibrate(kind === "medium" ? 15 : 12);
}
/* Telegram may clear the web view's storage (low space, cache cleanup). Settings and caches are mirrored into Telegram's
   DeviceStorage (on the phone, 5 MB per bot); if the local copy is gone at launch it is pulled back once and the page reloads. */
const tgStore = tgAt("9.0") && TG.DeviceStorage ? TG.DeviceStorage : null;
/* Each write to Telegram's storage is a round trip through the app, so a key is sent at most once per its delay (the
   latest value wins), and whatever is still waiting is sent straight away when the app is hidden or closed. The play
   position changes every few seconds while you listen: it goes at most every 30 s (and on pause / hide). */
const MIRROR = ["photoData", "wallpaperBlur", "oldPanel", "repeatMode", "hiddenAlbums", "albumOrder", "releaseMap2", "artistCache", "playState", "playPos", "perfLite"], mirrorT = {}, mirrorV = {};
const MIRROR_DELAY = { playState: 3000, playPos: 30000, artistCache: 5000, releaseMap2: 5000 };
function mirrorSend(k) { clearTimeout(mirrorT[k]); delete mirrorT[k]; if (!(k in mirrorV)) return; const v = mirrorV[k]; delete mirrorV[k]; try { tgStore.setItem(k, v); } catch (e) {} }
function mirrorFlush() { Object.keys(mirrorV).forEach(mirrorSend); }
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}
  if (tgStore && MIRROR.includes(k)) { mirrorV[k] = String(v); if (!mirrorT[k]) mirrorT[k] = setTimeout(() => mirrorSend(k), MIRROR_DELAY[k] || 800); }}};
if (tgStore && !store.get("tgMark")) (function () {
  let left = MIRROR.length, got = 0;
  const done = () => { if (--left) return; try { localStorage.setItem("tgMark", "1"); } catch (e) {} if (got && store.get("tgMark")) location.reload(); };   // reload only if the mark stuck (no reload loop when storage is blocked)
  MIRROR.forEach(k => { try { tgStore.getItem(k, (err, v) => { if (!err && v) { try { localStorage.setItem(k, v); got++; } catch (e) {} } done(); }); } catch (e) { done(); } });
})();

/* ---------- PERFORMANCE ----------
   Two quality levels. Normal: everything as designed, with the decorative light (glow, cover glass, breathing buttons)
   redrawn at up to 30 fps on phones; gestures and transitions always get every frame. Light: kicks in on its own when
   the phone can't keep up for a couple of seconds (screen recording, Low Power Mode, a hot phone, an old phone) and
   drops the costliest extras: the wallpaper parallax (which forces the whole glass panel to be re-blurred), and the
   glass edge is drawn at lower resolution with fewer samples. It switches back once things are smooth again for a
   while (unless it had to switch twice, then it stays light until the app is reopened). Settings > More > "Light
   effects" forces it on. Every loop that animates reports its frame times here through PERF.frame(). */
const TILT = { x: 0, y: 0, apply() {}, redraw: null };                // the current (smoothed) tilt, -1..1; set by the tilt module
const PERF = (() => {
  const phone = matchMedia("(pointer:coarse)").matches;
  let lite = false, auto = false, trips = 0, avg = 16.7, last = 0, slow = 0, fast = 0;
  const subs = [], forced = () => store.get("perfLite") === "1";
  function set(v) {
    if (v === lite) return; lite = v;
    document.documentElement.classList.toggle("lite", v);
    subs.forEach(f => { try { f(v); } catch (e) {} });
  }
  function frame(now) {                                               // call once per animation frame from a loop that asks for every frame
    const d = last ? now - last : 0; last = now;
    if (!d || d > 250) return;                                        // first frame, or a stall / tab switch: not a measure of smoothness
    avg += (d - avg) * .05;
    if (!lite) { if (avg > 24) { if (++slow > 75) { slow = 0; auto = true; trips++; set(true); } } else slow = 0; }   // below ~42 fps for ~2-3 s
    else if (auto && !forced() && trips < 2) { if (avg < 18.5) { if (++fast > 700) { fast = 0; auto = false; set(false); } } else fast = 0; }
  }
  return { frame, gap() { last = 0; }, on: f => subs.push(f), get lite() { return lite; }, phone,
    force(v) { store.set("perfLite", v ? "1" : "0"); if (v) set(true); else if (!auto) set(false); },
    get decoFps() { return lite ? 24 : phone ? 30 : 60; } };
})();
if (store.get("perfLite") === "1") PERF.force(true);

const LASTFM_API_KEY = "dbe9aea2d4e59436f4b2015d1f0e027a";
const albumMeta = {};
let tracks = [], queue = [], curId = null, uid = 0;
let currentAlbum = "All Tracks";

const audio = $("audio-element"), playBtn = $("play-btn");
const playIconSvg = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
const pauseIconSvg = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
const noteSvg = `<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- HOME SCREEN ICON ---------- */
(function () {
  try {
    const c = document.createElement("canvas"); c.width = c.height = 180;
    const x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 180, 180);
    g.addColorStop(0, "#1d4e5f"); g.addColorStop(1, "#0b1d24");
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.fillStyle = "#fff"; x.beginPath(); x.ellipse(66, 128, 24, 18, -0.35, 0, 7); x.fill();
    x.fillRect(84, 44, 12, 84); x.beginPath(); x.moveTo(96, 44); x.quadraticCurveTo(140, 56, 132, 96); x.lineTo(120, 92); x.quadraticCurveTo(122, 70, 96, 64); x.fill();
    const l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = c.toDataURL("image/png");
    document.head.appendChild(l);
  } catch (e) {}
})();

/* ---------- WALLPAPER ---------- */
const DEFAULT_WALL = "https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?auto=format&fit=crop&w=2400&q=75";
const FALLBACK_BG = "linear-gradient(160deg,#0b1d24,#1d4e5f 60%,#0b1d24)";
const mainBg = $("main-bg");
function applyBg() {
  const bl = +(store.get("wallpaperBlur") || 0);

  /* ---- lyrics: synced lines from LRCLIB (a free, open lyrics database), the current line lit and kept in view ----

  LYR = (() => {

    pset(pm, "--gi", Math.min(1, .5 + energy * .12 + pulse * .14 + tilt * .35 + .06 * Math.sin(s / 3.1)).toFixed(2));

/* the controls breathe: Play follows the music directly, prev/next a few frames later (a ripple outwards);

/* ---------- title spark ----------

}

/* ---------- glow layer ----------
   One layer behind the drawer content, not inside any scroller. Each cover's glow is positioned from the
   cover's on-screen rect every frame (only while the drawer is open), so it can spill past the scroller's edge
   and is faded there by the layer's mask, while the covers themselves stay clipped by their scroller.

(function () {
  const layer = $("glow-layer"), inner = document.querySelector(".drawer-inner"), wrap = document.querySelector(".player-wrapper"), M = 22;

    .observe(viewHost, { childList: true, subtree: true, attributes: true, attributeFilter: ["style", "class"] });

/* cover light colours: cluster the artwork into hue buckets, score them for how good they look as a glow, then correct the winner.

(function () {
