<script>
/* Telegram Mini App: Telegram's script is loaded only when the page was really opened inside Telegram
   (it passes #tgWebApp... in the URL), so the home-screen app never waits on telegram.org. */
(function () {
  var inTg = /tgWebApp/.test(location.hash + location.search);
  try { inTg = inTg || !!sessionStorage.getItem("__telegram__initParams"); } catch (e) {}
  if (inTg) { document.documentElement.classList.add("tg"); document.write('<script src="https://telegram.org/js/telegram-web-app.js?63"><\/script>'); }
})();
</script>

:root{--ease:cubic-bezier(.22,1,.36,1);--dur:.4s}
@keyframes viewIn{from{opacity:0;transform:translate(var(--dx,0),var(--dy,0))}to{opacity:1;transform:none}}
.v-in{animation:viewIn .34s var(--ease) both}

.card-in{animation:cardIn .36s var(--ease) backwards}
.player-btn,.tab-btn,.chip,.circle-btn,.upload-btn,.back-btn,.hidden-toggle,.done-btn{transition:background .22s var(--ease),color .22s var(--ease),transform .18s var(--ease),border-color .22s var(--ease),opacity .22s var(--ease)}

.album-card img,.album-card .all-tracks-icon{transition:transform .28s var(--ease),opacity .3s ease,box-shadow .28s var(--ease)}
#track-art-img{transition:opacity .3s ease}

.toast{transition:opacity .28s var(--ease),transform .32s var(--ease)!important}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== one idea: clear glass + the cover's own glow. Tilt only moves that glow (and the wallpaper a hair). ===== */
:root{--inset:10px;--glass-blur:blur(3px) saturate(150%) brightness(.92);--cw:114px;--art-x:24px}   /* --cw = prev+play+next width (3x34 + 2x6); cover (66px) is centred over that group */
.player-wrapper{background:linear-gradient(rgba(6,18,26,.13),rgba(6,18,26,.13)),var(--glass-bg)}
.bg-container{transform:translate3d(calc(var(--tx,0) * -6px),calc(var(--ty,0) * -6px),0) scale(1.04);will-change:transform}
/* corner highlight: fixed size (px), so it no longer grows when the drawer opens; no tilt */
.player-wrapper::before{background:linear-gradient(135deg,rgba(255,255,255,.17) 0,rgba(255,255,255,.04) 90px,rgba(255,255,255,0) 170px)}
.player-wrapper::after{content:none}
.track-info-container{position:relative;align-items:center}
.album-art{width:66px;height:66px;box-sizing:border-box;border-radius:12px;margin-left:var(--art-x);position:relative;z-index:1}
.art-bloom{position:absolute;left:calc(var(--inset) + var(--art-x));top:2px;width:66px;height:66px;border-radius:12px;background-size:cover;background-position:center;
  filter:blur(20px) saturate(1.6);opacity:calc(.38 + var(--pulse,0) * .24);
  transform:translate3d(calc(var(--tx,0) * 12px),calc(var(--ty,0) * 12px),0) scale(calc(1.5 + var(--pulse,0) * .12));pointer-events:none}
/* every album cover gets a quiet static glow taken from its own artwork */
.album-card{isolation:isolate}
/* progress dot glows with the music */
.slider-thumb{box-shadow:0 2px 6px rgba(0,0,0,.4),0 0 calc(8px + var(--pulse,0) * 10px) calc(1px + var(--pulse,0) * 2px) rgba(255,255,255,calc(.5 + var(--pulse,0) * .3))}
/* glow was cut off by the scroll/drawer boxes: give it room inside them (layout stays put via matching negative margins) */
@supports (overflow:clip){.drawer-inner,#view-host{overflow-x:visible;overflow-y:clip}}
.albums-grid-container,.artist-scroll{margin:-14px -20px 0;padding-inline:20px;padding-top:14px}
.artist-scroll{padding-bottom:28px}
.albums-grid{padding-bottom:24px}

/* ===== glow layer: glows live outside the scrollers, are positioned by JS, and fade at the scroller's edges ===== */
#glow-layer{position:absolute;left:0;right:0;top:0;height:0;overflow:hidden;z-index:-1;pointer-events:none;opacity:0;transition:opacity .3s var(--ease);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%)}
#glow-layer.on{opacity:1}
#glow-layer.off .glow{opacity:0!important}
.glow{position:absolute;left:0;top:0;border-radius:14px;background-size:cover;background-position:center;filter:blur(15px) saturate(1.5);opacity:0;transition:opacity .4s var(--ease);will-change:transform}
.glow.in{opacity:.4}
.glow.in.dim{opacity:.16}
.glow.in.live{opacity:calc(.5 + var(--pulse,0) * .35);transition:none}

/* long titles: the drawer column may never grow past the panel; titles wrap to 2 lines instead of running off */
.collapsible-content{grid-template-columns:minmax(0,1fr)}
.drawer-inner,#view-host{min-width:0}
.item-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;white-space:normal;overflow:hidden;overflow-wrap:anywhere;line-height:1.25}

/* artist page: fixed viewport so the panel never resizes while data arrives; skeletons hold the space */
.artist-scroll{height:450px}
.artist-hero-img{opacity:0;transition:opacity .5s var(--ease)}
.artist-hero-img.ready{opacity:1}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));background-size:200% 100%;animation:skm 1.4s linear infinite;border-radius:12px}
@keyframes skm{to{background-position:-200% 0}}
.bio-sk{height:118px;margin:10px 4px 0}
.sk-card .sq{width:100%;aspect-ratio:1/1}
.sk-card .ln{width:60%;height:9px;border-radius:5px}
.fade-img{opacity:0}.fade-img.in{opacity:1}

/* cover light: soft wedge of artwork-picked colour circling behind the cover (GPU rotate only), energy-driven bloom */
.art-light{position:absolute;left:calc(var(--inset) + var(--art-x) - 22px);top:-20px;width:110px;height:110px;border-radius:50%;pointer-events:none;filter:blur(15px);
  background:conic-gradient(rgba(var(--lc,200,215,225),0) 0deg,rgba(var(--lc,200,215,225),.9) 50deg,rgba(var(--lc,200,215,225),0) 135deg,rgba(var(--lc2,200,215,225),0) 190deg,rgba(var(--lc2,200,215,225),.55) 245deg,rgba(var(--lc2,200,215,225),0) 320deg);
  transform:rotate(var(--ang,0deg));opacity:calc((.24 + var(--en,0) * .26 + var(--pulse,0) * .22 + var(--br,.5) * .05) * var(--lk,1))}
.art-bloom{opacity:calc(.32 + var(--en,0) * .06 + var(--pulse,0) * .22 + var(--br,.5) * .06);
  transform:translate3d(calc(var(--tx,0) * 12px),calc(var(--ty,0) * 12px),0) scale(calc(1.5 + var(--pulse,0) * .12 + var(--br,.5) * .05))}

/* ===== glass cover =====
   The artwork and every glass layer sit in ONE clipped box (.art-clip), so they share exactly the same outline:
   nothing of the artwork can show outside the rim any more. Light is driven by JS on #player-main:
   --la light direction (same one that turns the halo behind), --gx/--gy surface hotspot, --gi rim brightness,
   --gt tilt boost (0 without tilt), --sh reflection streak, --rx/--ry edge refraction shift.
   It moves on its own all the time; tilt (when enabled) only adds to it. */
.album-art{border:0;background:none;overflow:visible;
  box-shadow:0 7px 18px rgba(0,0,0,.32),0 2px 5px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.45)}
.art-clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden;clip-path:inset(0 round 12px);background:rgba(0,0,0,.22);
  display:flex;align-items:center;justify-content:center;isolation:isolate}
.art-clip img{display:block}
.g{position:absolute;inset:0;border-radius:inherit;pointer-events:none}
/* edge refraction: a thin band where the artwork looks magnified through the glass edge; shifts a hair with the light */
.g-refr{background:var(--art,none) calc(50% + var(--rx,0px)) calc(50% + var(--ry,0px))/107% 107% no-repeat;filter:saturate(1.35) brightness(1.14) blur(.4px);
  opacity:calc(var(--art-on,0) * .42);transition:opacity .3s ease;
  -webkit-mask-image:linear-gradient(90deg,#000,transparent 4px,transparent calc(100% - 4px),#000),linear-gradient(#000,transparent 4px,transparent calc(100% - 4px),#000);
          mask-image:linear-gradient(90deg,#000,transparent 4px,transparent calc(100% - 4px),#000),linear-gradient(#000,transparent 4px,transparent calc(100% - 4px),#000)}
/* thickness: the lower edge sits a little in shadow, the upper edge catches a little light */
.g-shade{box-shadow:inset 0 -12px 16px -14px rgba(0,0,0,.45),inset 0 11px 14px -14px rgba(255,255,255,.3)}
/* surface: a soft specular hotspot on the side the light comes from + a faint sky reflection at the top */
.g-spec{background:
  radial-gradient(62% 62% at var(--gx,32%) var(--gy,20%),rgba(255,255,255,calc(.19 * var(--gl,1) * (1 + .7 * var(--gt,0)))) 0,rgba(255,255,255,calc(.06 * var(--gl,1))) 34%,rgba(255,255,255,0) 70%),
  linear-gradient(168deg,rgba(255,255,255,.08) 0,rgba(255,255,255,.02) 38%,rgba(255,255,255,0) 52%)}
/* a long glass reflection (with a thin second line) that glides across now and then */
.g-streak{mix-blend-mode:screen;background:linear-gradient(112deg,rgba(255,255,255,0) 40%,rgba(255,255,255,calc(.13 * var(--gl,1) * (1 + var(--gt,0)))) 47%,rgba(255,255,255,.03) 50%,rgba(255,255,255,calc(.07 * var(--gl,1))) 53%,rgba(255,255,255,0) 57%) calc(var(--sh,.5) * 100%) 0/300% 100% no-repeat}
/* soft inner glow along the edge, brightest where the light hits, tinted with the artwork's colours */
.g-glow{background:conic-gradient(from var(--la,-40deg),
    rgba(255,255,255,calc(.16 + .3 * var(--gi,.6))) 0deg,rgba(var(--lc,200,215,225),calc(.1 + .22 * var(--gi,.6))) 40deg,rgba(255,255,255,0) 95deg,rgba(255,255,255,0) 150deg,
    rgba(var(--lc2,200,215,225),calc(.05 + .15 * var(--gi,.6))) 180deg,rgba(255,255,255,0) 210deg,rgba(255,255,255,0) 265deg,
    rgba(var(--lc,200,215,225),calc(.1 + .22 * var(--gi,.6))) 320deg,rgba(255,255,255,calc(.16 + .3 * var(--gi,.6))) 360deg);
  -webkit-mask-image:linear-gradient(90deg,#000,transparent 7px,transparent calc(100% - 7px),#000),linear-gradient(#000,transparent 7px,transparent calc(100% - 7px),#000);
          mask-image:linear-gradient(90deg,#000,transparent 7px,transparent calc(100% - 7px),#000),linear-gradient(#000,transparent 7px,transparent calc(100% - 7px),#000)}
/* the crisp glass rim: runs the whole perimeter, catches the light on one side and a weaker bounce on the other */
.g-rim{box-sizing:border-box;padding:1px;
  background:conic-gradient(from var(--la,-40deg),
    rgba(255,255,255,calc(.5 + .45 * var(--gi,.6))) 0deg,rgba(var(--lc,200,215,225),calc(.3 + .3 * var(--gi,.6))) 32deg,rgba(255,255,255,.18) 80deg,rgba(255,255,255,.13) 145deg,
    rgba(var(--lc2,200,215,225),calc(.18 + .3 * var(--gi,.6))) 180deg,rgba(255,255,255,.13) 215deg,rgba(255,255,255,.18) 280deg,
    rgba(var(--lc,200,215,225),calc(.3 + .3 * var(--gi,.6))) 328deg,rgba(255,255,255,calc(.5 + .45 * var(--gi,.6))) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}

/* ===== title spark =====
   No object travels across: the letters themselves glow. A copy of the title sits exactly on top of it, its text
   transparent, with a soft wide band of light clipped to the glyphs; a halo round that copy makes only the letters under
   the band glow. JS (Web Animations) slides the band across and fades it in and out; otherwise it's invisible. */
.track-text{padding:6px 0;margin:-6px 0}                            /* room for the letters' glow; layout unchanged */
.title-box{position:relative;min-width:0}
.track-title.title-glint{position:absolute;inset:0;pointer-events:none;opacity:0;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;
  background:linear-gradient(90deg,rgba(255,255,255,0) 0,rgba(255,255,255,.35) 25%,rgba(255,255,255,.9) 45%,#fff 50%,rgba(255,255,255,.9) 55%,rgba(255,255,255,.35) 75%,rgba(255,255,255,0) 100%) -120px 0/84px 100% no-repeat;
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 1.5px rgba(255,255,255,.9)) drop-shadow(0 0 6px rgba(var(--lc,200,215,225),.75))}

/* ===== inside Telegram (html.tg) =====
   No Safari toolbar to paint under, so the page is exactly the screen and never scrolls itself. In full-screen mode
   Telegram draws its Close / ⋯ pills over the top of the page: --tg-content-safe-area-inset-top keeps the player below them. */
html.tg{height:100%;overflow:hidden;overscroll-behavior:none}
html.tg .bg-container,html.tg .bg-vignette{height:100%}
html.tg body{--tg-top:max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px));--tg-bot:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
  padding-top:calc(var(--tg-top) + var(--tg-content-safe-area-inset-top,0px) + 16px);overscroll-behavior:none}
html.tg .gear-btn{bottom:calc(var(--tg-bot) + 20px)}
html.tg .floating-customizer{bottom:calc(var(--tg-bot) + 74px)}
html.tg .toast{bottom:calc(var(--tg-bot) + 84px)}
</style>
</head>

<script>
const $ = id => document.getElementById(id);

/* ---------- TELEGRAM ----------
   TG is Telegram's Mini App object when the player runs inside Telegram, and null everywhere else (Safari, the home-screen
   app), so every Telegram-only line below is skipped outside it. tgAt(v) = "this Telegram app supports Bot API v". */
const TG = (() => { const w = window.Telegram && window.Telegram.WebApp; return w && w.platform && w.platform !== "unknown" ? w : null; })();
const tgAt = v => { try { return !!TG && TG.isVersionAtLeast(v); } catch (e) { return false; } };
/* Bot library: inside Telegram the songs are the ones you sent the bot, listed and streamed by your server.
   In the browser / home-screen app nothing changes: songs come from the phone's file picker. */
const API_BASE = "https://macawp3.duckdns.org";
let botMode = !!TG && !!TG.initData;                   // switches off if the server can't be reached, so the phone's files still work
function haptic(kind) {                               // "light" | "medium" | "select". Telegram's haptics also work on iPhone; navigator.vibrate is the fallback (Android browsers)
  if (tgAt("6.1")) { try { kind === "select" ? TG.HapticFeedback.selectionChanged() : TG.HapticFeedback.impactOccurred(kind); } catch (e) {} return; }
  if (kind !== "select" && navigator.vibrate) navigator.vibrate(kind === "medium" ? 15 : 12);
}
/* Telegram may clear the web view's storage (low space, cache cleanup). Settings and caches are mirrored into Telegram's
   DeviceStorage (on the phone, 5 MB per bot); if the local copy is gone at launch it is pulled back once and the page reloads. */
const tgStore = tgAt("9.0") && TG.DeviceStorage ? TG.DeviceStorage : null;
const MIRROR = ["photoData", "wallpaperBlur", "hiddenAlbums", "albumOrder", "releaseMap2", "artistCache"], mirrorT = {};
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}
  if (tgStore && MIRROR.includes(k)) { clearTimeout(mirrorT[k]); mirrorT[k] = setTimeout(() => { try { tgStore.setItem(k, String(v)); } catch (e) {} }, 800); }}};
if (tgStore && !store.get("tgMark")) (function () {
  let left = MIRROR.length, got = 0;
  const done = () => { if (--left) return; try { localStorage.setItem("tgMark", "1"); } catch (e) {} if (got && store.get("tgMark")) location.reload(); };   // reload only if the mark stuck (no reload loop when storage is blocked)
  MIRROR.forEach(k => { try { tgStore.getItem(k, (err, v) => { if (!err && v) { try { localStorage.setItem(k, v); got++; } catch (e) {} } done(); }); } catch (e) { done(); } });
})();

const LASTFM_API_KEY = "dbe9aea2d4e59436f4b2015d1f0e027a";
const albumMeta = {};
let tracks = [], queue = [], curId = null, uid = 0;
let currentAlbum = "All Tracks";

const audio = $("audio-element"), playBtn = $("play-btn");
const playIconSvg = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
const pauseIconSvg = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
const noteSvg = `<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- HOME SCREEN ICON ---------- */
(function () {
  try {
    const c = document.createElement("canvas"); c.width = c.height = 180;
    const x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 180, 180);
    g.addColorStop(0, "#1d4e5f"); g.addColorStop(1, "#0b1d24");

/* cover light colours: cluster the artwork into hue buckets, score them for how good they look as a glow, then correct the winner.

(function () {
