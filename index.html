<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Player">
<meta name="theme-color" content="#0b1d24">
<title>Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --glass-bg:rgba(255,255,255,.03);--glass-bg-hover:rgba(255,255,255,.08);
  --glass-border:rgba(255,255,255,.12);--glass-border-top:rgba(255,255,255,.4);
  --glass-blur:blur(25px) saturate(180%);
  --glass-shadow:0 20px 50px rgba(0,0,0,.3),0 4px 15px rgba(0,0,0,.15),inset 0 0 2px rgba(255,255,255,.2);
}
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:#0b1d24}
body{margin:0;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 0;box-sizing:border-box;-webkit-text-size-adjust:100%}
.bg-container{position:fixed;top:-5%;bottom:-15%;left:-3%;right:-3%;z-index:-2;background-size:cover;background-position:center;transition:background .3s ease}
.bg-vignette{position:fixed;top:0;bottom:-15%;left:0;right:0;background:radial-gradient(circle at center,rgba(0,0,0,0) 30%,rgba(0,0,0,.6) 100%);pointer-events:none;z-index:-1}

.player-wrapper{position:relative;width:100%;max-width:580px;background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);border-top:1px solid var(--glass-border-top);border-radius:24px;padding:20px;box-sizing:border-box;box-shadow:var(--glass-shadow);
  display:flex;flex-direction:column;gap:16px;z-index:1}
.player-wrapper::before{content:'';position:absolute;inset:0;border-radius:24px;pointer-events:none;z-index:2;
  background:linear-gradient(135deg,rgba(255,255,255,.25) 0%,rgba(255,255,255,.05) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 100%)}

.drop-zone{border:1px dashed rgba(255,255,255,.2);border-radius:16px;padding:30px;text-align:center;color:rgba(255,255,255,.6);font-size:14px;cursor:pointer;background:rgba(255,255,255,.02)}
.drop-zone:active{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.4);color:#fff}

.albums-grid-container{max-height:240px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.albums-grid-container::-webkit-scrollbar{display:none}
.albums-grid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:10px;align-items:start}
.album-card{position:relative;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;width:100%;min-width:0;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.album-card img,.album-card .all-tracks-icon{display:block;width:100%;max-width:100%;height:auto;min-width:0;aspect-ratio:1/1;border-radius:12px;border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 15px rgba(0,0,0,.3);object-fit:cover;transition:transform .2s ease;box-sizing:border-box}
.album-card img{pointer-events:none;-webkit-user-drag:none}
.album-card.lifted{z-index:20}
.album-card.lifted img,.album-card.lifted .all-tracks-icon{box-shadow:0 20px 34px rgba(0,0,0,.55)}
.album-card:active img,.album-card:active .all-tracks-icon{transform:scale(.96)}
.album-card .all-tracks-icon{background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}
.album-card .all-tracks-icon svg{width:40px;height:40px;fill:rgba(255,255,255,.4)}
.album-card-title{width:100%;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.8)}

.track-info-container{display:flex;align-items:center;gap:16px;padding:2px 4px}
.album-art{width:64px;height:64px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;box-shadow:0 5px 15px rgba(0,0,0,.3)}
.album-art img{width:100%;height:100%;object-fit:cover}
.album-art svg{width:24px;height:24px;fill:rgba(255,255,255,.4)}
.track-text{display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden;flex:1}
.track-title{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 5px rgba(0,0,0,.5)}
.track-artist{font-size:13px;color:rgba(255,255,255,.6);text-shadow:0 1px 3px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.progress-container{display:flex;align-items:center;flex-wrap:nowrap;gap:10px;font-size:11px;color:rgba(255,255,255,.7);width:100%;font-variant-numeric:tabular-nums}
.controls-cluster{display:flex;align-items:center;gap:8px}
.player-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 5px rgba(0,0,0,.2);padding:0}
.player-btn:active{background:rgba(255,255,255,.25);transform:scale(.94)}
.player-btn svg{width:14px;height:14px;fill:currentColor}

.custom-range-slider{position:relative;height:4px;background:rgba(255,255,255,.15);border-radius:2px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
.custom-range-slider::before{content:'';position:absolute;inset:-16px 0}
.slider-fill{position:absolute;left:0;top:0;height:100%;background:#fff;border-radius:2px;width:0%;box-shadow:0 0 8px rgba(255,255,255,.5)}
.slider-thumb{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transform:translate(-50%,-50%);left:0%}
#progress-slider{flex:1;min-width:0}

.player-footer{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.tab-buttons{display:flex;gap:16px}
.tab-btn{font:600 11px -apple-system,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.4);background:none;border:none;cursor:pointer;padding:10px 0}
.tab-btn.active{color:#fff;text-shadow:0 0 10px rgba(255,255,255,.3)}
.add-btn{color:rgba(255,255,255,.7)}

.collapsible-content{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1);border-top:0 solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:16px}
.collapsible-content.expanded{max-height:500px;border-top-width:1px;padding-top:14px}

.back-btn{display:flex;align-items:center;gap:8px;font:600 12px -apple-system,system-ui,sans-serif;color:rgba(255,255,255,.6);background:none;border:none;cursor:pointer;padding:8px 12px;margin-bottom:4px;border-radius:12px}
.back-btn:active{color:#fff;background:rgba(255,255,255,.05)}
.back-btn svg{width:14px;height:14px;fill:currentColor}

.scroll-container-wrapper{position:relative;max-height:280px;padding-bottom:10px}
.playlist-container,.queue-container{max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.playlist-container::-webkit-scrollbar,.queue-container::-webkit-scrollbar{display:none}

.playlist-item,.queue-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:12px;cursor:pointer;gap:10px}
.playlist-item:active,.queue-item:active{background:rgba(255,255,255,.08)}
.playlist-item.missing{opacity:.35;cursor:default}
.playlist-item.missing:active{background:none}
.playlist-item.active{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.1)}
.item-art{width:28px;height:28px;border-radius:6px;background:rgba(255,255,255,.05);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.1)}
.item-art img{width:100%;height:100%;object-fit:cover}
.item-art svg{width:12px;height:12px;fill:rgba(255,255,255,.3)}
.item-text{flex:1;display:flex;flex-direction:column;overflow:hidden}
.item-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-artist{font-size:11px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.circle-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.circle-btn.success{background:#2ecc71;border-color:#2ecc71}

.gear-btn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);right:20px;width:42px;height:42px;background:rgba(15,23,30,.4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:11;opacity:.75}
.gear-btn svg{width:18px;height:18px;fill:rgba(255,255,255,.8)}
.floating-customizer{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);right:20px;width:min(280px,calc(100% - 40px));background:rgba(15,23,30,.65);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);
  border:1px solid rgba(255,255,255,.12);border-top:1px solid rgba(255,255,255,.3);border-radius:16px;padding:14px;box-sizing:border-box;box-shadow:0 15px 35px rgba(0,0,0,.4);z-index:10;display:flex;flex-direction:column;gap:12px;
  opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .2s ease,transform .2s ease}
.floating-customizer.active{opacity:1;pointer-events:auto;transform:none}
.wallpaper-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wall-thumb{height:36px;border-radius:8px;cursor:pointer;border:1px solid rgba(255,255,255,.15);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:14px}
.wall-thumb.active{border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,.3)}
.upload-btn{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#fff;font:600 13px -apple-system,system-ui,sans-serif;cursor:pointer}
.upload-btn:active{background:rgba(255,255,255,.22)}
.upload-btn.ghost{background:none;border-color:transparent;color:rgba(255,255,255,.6);font-weight:500;padding:6px}
.slider-setting{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.6)}
.slider-setting input{width:130px}
</style>
</head>
<body>

<div class="bg-container" id="main-bg"></div>
<div class="bg-vignette"></div>

<div class="player-wrapper">

  <div class="drop-zone" id="drop-zone">
    Tap to choose your songs<br>
    <span style="font-size:11px;opacity:.7;">(Select multiple audio files)</span>
  </div>
  <input type="file" id="file-input" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac" multiple style="display:none;">
  <input type="file" id="photo-input" accept="image/*" style="display:none;">

  <div class="track-info-container" id="player-main" style="display:none;">
    <div class="album-art" id="album-art-box">
      <svg id="fallback-art" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      <img id="track-art-img" style="display:none;">
    </div>
    <div class="track-text">
      <div class="track-title" id="track-title">Loading...</div>
      <div class="track-artist" id="track-artist">Unknown Artist</div>
    </div>
  </div>

  <div class="progress-container" id="controls-main" style="display:none;">
    <div class="controls-cluster">
      <button class="player-btn" id="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="player-btn" id="skip-btn"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
    <span id="current-time">0:00</span>
    <div class="custom-range-slider" id="progress-slider"><div class="slider-fill"></div><div class="slider-thumb"></div></div>
    <span id="total-duration">0:00</span>
  </div>

  <div class="player-footer" id="footer-main" style="display:none;">
    <button class="tab-btn add-btn" id="btn-add">+ Songs</button>
    <div class="tab-buttons">
      <button class="tab-btn" id="btn-queue">Up Next</button>
      <button class="tab-btn" id="btn-playlist">Library</button>
    </div>
  </div>

  <div class="collapsible-content" id="drawer-box">
    <div class="albums-grid-container" id="albums-grid-wrapper" style="display:none;">
      <div class="albums-grid" id="albums-shelf"></div>
    </div>
    <div class="scroll-container-wrapper" id="playlist-wrapper" style="display:none;">
      <button class="back-btn" id="back-to-grid-btn">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        <span>Back to Albums</span>
      </button>
      <div class="playlist-container" id="playlist-ui"></div>
    </div>
    <div class="scroll-container-wrapper" id="queue-wrapper" style="display:none;">
      <div class="queue-container" id="queue-ui"></div>
    </div>
  </div>
</div>

<div class="gear-btn" id="gear-trigger">
  <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12c0,0.32,0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.5c-1.93,0-3.5-1.57-3.5-3.5 c0-1.93,1.57-3.5,3.5-3.5s3.5,1.57,3.5,3.5C15.5,13.93,13.93,15.5,12,15.5z"/></svg>
</div>
<div class="floating-customizer" id="settings-panel">
  <div class="slider-setting"><span>Bg Blur</span><input type="range" id="blur-slider" min="0" max="30" step="1" value="0"></div>
  <button class="upload-btn" id="upload-wall">Upload wallpaper</button>
  <button class="upload-btn ghost" id="reset-wall">Use default wallpaper</button>
</div>

<audio id="audio-element" playsinline></audio>

<script>
const $ = id => document.getElementById(id);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const LASTFM_API_KEY = "dbe9aea2d4e59436f4b2015d1f0e027a";
const albumMeta = {};
let tracks = [], queue = [], curId = null, uid = 0;
let currentAlbum = "All Tracks";

const audio = $("audio-element"), playBtn = $("play-btn");
const playIconSvg = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
const pauseIconSvg = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
const noteSvg = `<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- HOME SCREEN ICON ---------- */
(function () {
  try {
    const c = document.createElement("canvas"); c.width = c.height = 180;
    const x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 180, 180);
    g.addColorStop(0, "#1d4e5f"); g.addColorStop(1, "#0b1d24");
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.fillStyle = "#fff"; x.beginPath(); x.ellipse(66, 128, 24, 18, -0.35, 0, 7); x.fill();
    x.fillRect(84, 44, 12, 84); x.beginPath(); x.moveTo(96, 44); x.quadraticCurveTo(140, 56, 132, 96); x.lineTo(120, 92); x.quadraticCurveTo(122, 70, 96, 64); x.fill();
    const l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = c.toDataURL("image/png");
    document.head.appendChild(l);
  } catch (e) {}
})();

/* ---------- WALLPAPER ---------- */
const DEFAULT_WALL = "https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?auto=format&fit=crop&w=2400&q=75";
const FALLBACK_BG = "linear-gradient(160deg,#0b1d24,#1d4e5f 60%,#0b1d24)";
const mainBg = $("main-bg");
function applyBg() {
  mainBg.style.filter = `blur(${store.get("wallpaperBlur") || 0}px)`;
  const custom = store.get("photoData");
  mainBg.style.backgroundImage = `url('${custom || DEFAULT_WALL}'), ${FALLBACK_BG}`;
  mainBg.style.backgroundPosition = custom ? "center" : "70% 24%, center";
}
$("upload-wall").addEventListener("click", () => $("photo-input").click());
$("reset-wall").addEventListener("click", () => { store.set("photoData", ""); applyBg(); });
$("photo-input").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(), u = URL.createObjectURL(f);
  img.onload = () => {
    const sc = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = img.width * sc; c.height = img.height * sc;
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    store.set("photoData", c.toDataURL("image/jpeg", .82));
    URL.revokeObjectURL(u); applyBg();
  };
  img.src = u; e.target.value = "";
});
const blurSlider = $("blur-slider");
blurSlider.value = store.get("wallpaperBlur") || "0";
blurSlider.addEventListener("input", e => { store.set("wallpaperBlur", e.target.value); applyBg(); });
const gearBtn = $("gear-trigger"), settingsPanel = $("settings-panel");
gearBtn.addEventListener("click", () => settingsPanel.classList.toggle("active"));
document.addEventListener("click", e => {
  if (!settingsPanel.contains(e.target) && !gearBtn.contains(e.target)) settingsPanel.classList.remove("active");
});
applyBg();

/* ---------- SLIDER (mouse + touch) ---------- */
function setupCustomSlider(id, cb) {
  const slider = $(id), fill = slider.querySelector(".slider-fill"), thumb = slider.querySelector(".slider-thumb");
  let dragging = false;
  const visual = p => { p = Math.max(0, Math.min(100, p)); fill.style.width = p + "%"; thumb.style.left = p + "%"; };
  const handle = e => { const r = slider.getBoundingClientRect(); const p = (e.clientX - r.left) / r.width * 100; visual(p); cb(Math.max(0, Math.min(1, p / 100))); };
  slider.addEventListener("pointerdown", e => { dragging = true; slider.setPointerCapture(e.pointerId); handle(e); });
  slider.addEventListener("pointermove", e => { if (dragging) handle(e); });
  const end = () => { dragging = false; };
  slider.addEventListener("pointerup", end); slider.addEventListener("pointercancel", end);
  return { setValue: v => { if (!dragging) visual(v * 100); } };
}
const progressCtrl = setupCustomSlider("progress-slider", v => { if (isFinite(audio.duration)) audio.currentTime = v * audio.duration; });

/* ---------- LOADING SONGS ---------- */
$("drop-zone").addEventListener("click", () => $("file-input").click());
$("btn-add").addEventListener("click", () => $("file-input").click());
$("file-input").addEventListener("change", async e => {
  const files = Array.from(e.target.files); e.target.value = "";
  if (!files.length) return;
  $("drop-zone").style.display = "none";
  $("player-main").style.display = "flex";
  $("controls-main").style.display = "flex";
  $("footer-main").style.display = "flex";
  for (const f of files) await addFile(f);
  renderAlbums(); renderPlaylist();
});
function readTags(f) {
  return new Promise(res => {
    if (!window.jsmediatags) return res({});
    try { jsmediatags.read(f, { onSuccess: t => res(t.tags || {}), onError: () => res({}) }); } catch (e) { res({}); }
  });
}
async function addFile(f) {
  const t = await readTags(f);
  let art = null;
  if (t.picture) { try { art = URL.createObjectURL(new Blob([new Uint8Array(t.picture.data)], { type: t.picture.format || "image/jpeg" })); } catch (e) {} }
  const tr = { id: ++uid, title: t.title || f.name.replace(/\.[^.]+$/, ""), artist: t.artist || "Unknown Artist",
    album: t.album || "Unknown Album", num: parseInt(t.track, 10) || 0, file: f, art };
  const rk = resolveKey(tr);
  if (mbCache[rk] && mbCache[rk] !== tr.album) { tr.tagAlbum = tr.album; tr.album = mbCache[rk]; tr.art = null; }
  tracks.push(tr);
  processTrackAlbum(tr);
  tracks.sort((a, b) => a.album.localeCompare(b.album) || a.num - b.num || a.title.localeCompare(b.title));
  if (curId === null) loadTrack(tr.id, false);
}
const norm = s => String(s).toLowerCase().replace(/\(.*?\)|\[.*?\]/g, "").replace(/[^a-z0-9]/g, "");
const albumP = {};
function fetchAlbumMeta(artist, album) {
  if (album === "Unknown Album" || artist === "Unknown Artist") return Promise.resolve(null);
  if (albumP[album]) return albumP[album];
  return albumP[album] = (async () => {
    try {
      const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 8000);
      const url = `https://ws.audioscrobbler.com/2.0/?method=album.getinfo&api_key=${LASTFM_API_KEY}&artist=${encodeURIComponent(artist)}&album=${encodeURIComponent(album)}&format=json`;
      const data = await (await fetch(url, { signal: ctrl.signal })).json(); clearTimeout(to);
      const a = data.album; if (!a) return null;
      const img = (a.image || []).slice().reverse().find(i => i["#text"]);
      let list = a.tracks && a.tracks.track ? a.tracks.track : [];
      if (!Array.isArray(list)) list = [list];
      albumMeta[album] = { artist, cover: img ? img["#text"] : null, tracks: list.map(t => t.name) };
      renderAlbums(); renderPlaylist();
      return albumMeta[album];
    } catch (e) { return null; }
  })();
}

/* --- find the track's real album when the file's tag is a playlist/collection --- */
const mbCache = (() => { try { return JSON.parse(store.get("resolvedAlbums") || "{}"); } catch (e) { return {}; } })();
let mbChain = Promise.resolve();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const cleanTitle = s => s.replace(/\s*[\(\[].*?[\)\]]/g, "").replace(/\s-\s.*$/, "").trim();
const mainArtist = s => s.split(/\s*(?:;|,|&|\bfeat\.|\bft\.)\s*/i)[0].trim();
const resolveKey = tr => norm(mainArtist(tr.artist)) + "|" + norm(cleanTitle(tr.title));
async function findOriginalAlbum(tr) {
  const title = cleanTitle(tr.title), artist = mainArtist(tr.artist);
  try {
    const q = `recording:"${title}" AND artist:"${artist}"`;
    const d = await (await fetch(`https://musicbrainz.org/ws/2/recording?query=${encodeURIComponent(q)}&fmt=json&limit=15`)).json();
    let best = null;
    for (const rec of d.recordings || []) {
      if ((rec.score || 0) < 90 || norm(rec.title) !== norm(title)) continue;
      for (const rel of rec.releases || []) {
        const rg = rel["release-group"] || {};
        if (rg["primary-type"] !== "Album" || (rg["secondary-types"] || []).length) continue;
        if (rel.status && rel.status !== "Official") continue;
        const date = rel.date || "9999";
        if (!best || date < best.date) best = { date, name: rg.title };
      }
    }
    if (best) return best.name;
  } catch (e) {}
  try {
    const d = await (await fetch(`https://ws.audioscrobbler.com/2.0/?method=track.getinfo&api_key=${LASTFM_API_KEY}&artist=${encodeURIComponent(artist)}&track=${encodeURIComponent(title)}&autocorrect=1&format=json`)).json();
    if (d.track && d.track.album && d.track.album.title) return d.track.album.title;
  } catch (e) {}
  return null;
}
function refreshNowPlaying() {
  const t = tracks.find(x => x.id === curId); if (!t) return;
  const art = t.art || albumCover(t.album), img = $("track-art-img");
  if (art) { img.src = art; img.style.display = "block"; $("fallback-art").style.display = "none"; }
  else { img.style.display = "none"; $("fallback-art").style.display = "block"; }
}
async function processTrackAlbum(tr) {
  if (tr.artist === "Unknown Artist") return;
  const meta = await fetchAlbumMeta(tr.artist, tr.album);
  const nt = norm(tr.title);
  const listed = meta && meta.tracks.some(n => { const a = norm(n); return a && nt && (a === nt || a.includes(nt) || nt.includes(a)); });
  if (listed) return;                                   // tag album is a real album containing this song
  const key = resolveKey(tr);
  let real = mbCache[key];
  if (!real) {
    real = await new Promise(res => { mbChain = mbChain.then(async () => { const r = await findOriginalAlbum(tr); await sleep(1100); res(r); }); });
    if (real) { mbCache[key] = real; store.set("resolvedAlbums", JSON.stringify(mbCache)); }
  }
  if (!real || real === tr.album) return;
  tr.tagAlbum = tr.album; tr.album = real; tr.art = null;
  tracks.sort((a, b) => a.album.localeCompare(b.album) || a.num - b.num || a.title.localeCompare(b.title));
  await fetchAlbumMeta(tr.artist, real);
  renderAlbums(); renderPlaylist();
  if (tr.id === curId) refreshNowPlaying();
}
function albumCover(name) { const t = tracks.find(t => t.album === name && t.art); return t ? t.art : (albumMeta[name] && albumMeta[name].cover) || null; }
function albumEntries(name) {
  const local = tracks.filter(t => t.album === name), meta = albumMeta[name];
  if (!meta || !meta.tracks.length) return local.map(t => ({ track: t, title: t.title, num: t.num }));
  const used = new Set(), found = meta.tracks.map(() => null);
  const pass = fn => meta.tracks.forEach((n, i) => { if (found[i]) return; const t = local.find(x => !used.has(x.id) && fn(x, n, i)); if (t) { used.add(t.id); found[i] = t; } });
  pass((x, n) => norm(x.title) === norm(n));
  pass((x, n, i) => x.num === i + 1);
  pass((x, n) => norm(n).length > 2 && (norm(x.title).includes(norm(n)) || norm(n).includes(norm(x.title))));
  const out = meta.tracks.map((n, i) => ({ track: found[i], title: found[i] ? found[i].title : n, num: i + 1 }));
  local.filter(x => !used.has(x.id)).forEach(t => out.push({ track: t, title: t.title, num: t.num }));
  return out;
}
function contextList() { return currentAlbum === "All Tracks" ? tracks : albumEntries(currentAlbum).filter(e => e.track).map(e => e.track); }

/* ---------- RENDER ---------- */
let albumOrder = []; try { albumOrder = JSON.parse(store.get("albumOrder") || "[]"); } catch (e) {}
function orderedAlbumNames() {
  const rank = n => { const i = albumOrder.indexOf(n); return i < 0 ? 1e6 : i; };
  return [...new Set(tracks.map(t => t.album))].map((n, i) => [n, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(x => x[0]);
}
function saveOrder(keys) {
  const old = albumOrder.slice(), vis = new Set(keys), inOld = keys.filter(k => old.includes(k));
  const slots = old.map((k, i) => vis.has(k) ? i : -1).filter(i => i >= 0);
  const res = old.slice(); slots.forEach((sl, j) => { res[sl] = inOld[j]; });
  keys.forEach((k, i) => { if (!res.includes(k)) res.splice((i ? res.indexOf(keys[i - 1]) : -1) + 1, 0, k); });
  albumOrder = res; store.set("albumOrder", JSON.stringify(res));
}
function renderAlbums() {
  if (drag && drag.active) return;
  const shelf = $("albums-shelf"); shelf.innerHTML = "";
  const mk = (title, inner, onClick, key) => {
    const c = document.createElement("div"); c.className = "album-card";
    c.innerHTML = inner + `<div class="album-card-title">${esc(title)}</div>`;
    c.addEventListener("click", () => { if (suppressClick) { suppressClick = false; return; } onClick(); });
    if (key !== undefined) { c.dataset.key = key; attachDrag(c); }
    shelf.appendChild(c); return c;
  };
  const folder = `<div class="all-tracks-icon"><svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg></div>`;
  mk("All Tracks", folder, () => { currentAlbum = "All Tracks"; openTracklist(); }).style.order = 0;
  orderedAlbumNames().forEach((name, i) => {
    const cover = albumCover(name);
    mk(name, cover ? `<img src="${cover}" alt="">` : `<div class="all-tracks-icon">${noteSvg}</div>`, () => { currentAlbum = name; openTracklist(); }, name).style.order = i + 1;
  });
}

/* ---- drag to reorder (long-press, then drag) ---- */
let drag = null, suppressClick = false;
document.addEventListener("touchmove", e => { if (drag && drag.active) e.preventDefault(); }, { passive: false });
const cardsOf = () => [...$("albums-shelf").querySelectorAll(".album-card[data-key]")];
const applyKeys = keys => { const cs = cardsOf(); keys.forEach((k, i) => { const c = cs.find(x => x.dataset.key === k); if (c) c.style.order = i + 1; }); };
function flip(els, mutate) {
  const first = els.map(e => e.getBoundingClientRect());
  els.forEach(e => { e.style.transition = "none"; e.style.transform = ""; });
  mutate();
  els.forEach((e, i) => {
    const l = e.getBoundingClientRect();
    e.style.transform = `translate(${first[i].left - l.left}px,${first[i].top - l.top}px)`;
  });
  void document.body.offsetHeight;
  els.forEach(e => { e.style.transition = "transform .28s cubic-bezier(.2,.8,.2,1)"; e.style.transform = ""; });
}
function attachDrag(card) {
  card.addEventListener("contextmenu", e => e.preventDefault());
  card.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    const shelf = $("albums-shelf");
    drag = { card, x: e.clientX, y: e.clientY, cx: e.clientX, cy: e.clientY, active: false };
    drag.timer = setTimeout(() => {
      if (!drag) return;
      const gr = shelf.getBoundingClientRect();
      drag.active = true; drag.follow = false;
      drag.grabX = drag.x - gr.left - card.offsetLeft; drag.grabY = drag.y - gr.top - card.offsetTop;
      drag.keys = [...cardsOf()].sort((a, b) => a.style.order - b.style.order).map(c => c.dataset.key);
      card.classList.add("lifted"); card.style.zIndex = 20;
      card.style.transition = "transform .18s cubic-bezier(.2,.8,.2,1)";
      $("albums-grid-wrapper").style.overflowY = "hidden";
      if (navigator.vibrate) navigator.vibrate(12);
      setTimeout(() => { if (drag && drag.card === card) { drag.follow = true; card.style.transition = "none"; } }, 190);
      dragUpdate(); drag.raf = requestAnimationFrame(dragLoop);
    }, e.pointerType === "mouse" ? 200 : 380);
  });
}
function dragUpdate() {
  const d = drag, c = d.card, gr = $("albums-shelf").getBoundingClientRect();
  const px = d.cx - gr.left, py = d.cy - gr.top;
  const others = cardsOf().filter(o => o !== c);
  const t = others.find(o => px >= o.offsetLeft && px <= o.offsetLeft + o.offsetWidth && py >= o.offsetTop && py <= o.offsetTop + o.offsetHeight);
  if (t) {
    const from = d.keys.indexOf(c.dataset.key), to = d.keys.indexOf(t.dataset.key);
    if (from !== to && from >= 0 && to >= 0) flip(others, () => { d.keys.splice(to, 0, d.keys.splice(from, 1)[0]); applyKeys(d.keys); });
  }
  c.style.transform = `translate(${px - d.grabX - c.offsetLeft}px,${py - d.grabY - c.offsetTop}px) scale(1.08)`;
}
function dragLoop() {
  if (!drag || !drag.active) return;
  const box = $("albums-grid-wrapper"), r = box.getBoundingClientRect();
  const dy = drag.cy < r.top + 36 ? -7 : drag.cy > r.bottom - 36 ? 7 : 0;
  if (dy) { box.scrollTop += dy; dragUpdate(); }
  drag.raf = requestAnimationFrame(dragLoop);
}
document.addEventListener("pointermove", e => {
  if (!drag) return;
  drag.cx = e.clientX; drag.cy = e.clientY;
  if (!drag.active) { if (Math.hypot(drag.cx - drag.x, drag.cy - drag.y) > 8) { clearTimeout(drag.timer); drag = null; } return; }
  dragUpdate();
});
function endDrag() {
  if (!drag) return;
  clearTimeout(drag.timer);
  const d = drag; drag = null;
  if (!d.active) return;
  cancelAnimationFrame(d.raf);
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 400);
  $("albums-grid-wrapper").style.overflowY = "";
  const c = d.card;
  c.style.transition = "transform .26s cubic-bezier(.2,.8,.2,1)"; c.style.transform = ""; c.classList.remove("lifted");
  setTimeout(() => { c.style.transition = ""; c.style.zIndex = ""; }, 280);
  saveOrder(d.keys);
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

function openTracklist() {
  $("albums-grid-wrapper").style.display = "none";
  $("playlist-wrapper").style.display = "block";
  renderPlaylist();
}
function itemHTML(art, title, sub) {
  return `<div class="item-art">${art ? `<img src="${art}" alt="">` : noteSvg}</div>
    <div class="item-text"><div class="item-title">${esc(title)}</div><div class="item-artist">${esc(sub)}</div></div>`;
}
function renderPlaylist() {
  const ui = $("playlist-ui"); ui.innerHTML = "";
  const all = currentAlbum === "All Tracks";
  const entries = all ? tracks.map(t => ({ track: t, title: t.title, num: t.num })) : albumEntries(currentAlbum);
  entries.forEach(e => {
    const t = e.track, item = document.createElement("div");
    item.className = "playlist-item" + (t ? "" : " missing") + (t && t.id === curId ? " active" : "");
    const label = (e.num ? e.num + ". " : "") + e.title;
    if (!t) {
      item.innerHTML = itemHTML(albumCover(currentAlbum), label, "🔒 File missing");
      ui.appendChild(item); return;
    }
    item.innerHTML = itemHTML(t.art || albumCover(t.album), label, t.artist);
    item.addEventListener("click", () => loadTrack(t.id, true));
    const plus = document.createElement("button");
    plus.className = "circle-btn"; plus.textContent = "+";
    plus.addEventListener("click", ev => {
      ev.stopPropagation(); queue.push(t.id); renderQueue();
      plus.classList.add("success"); plus.textContent = "✓";
      setTimeout(() => { plus.classList.remove("success"); plus.textContent = "+"; }, 800);
    });
    item.appendChild(plus); ui.appendChild(item);
  });
}
function renderQueue() {
  const ui = $("queue-ui");
  if (!queue.length) { ui.innerHTML = '<div style="font-size:12px;color:rgba(255,255,255,.4);text-align:center;padding:20px;">Queue is empty.</div>'; return; }
  ui.innerHTML = "";
  queue.forEach((id, i) => {
    const t = tracks.find(x => x.id === id); if (!t) return;
    const item = document.createElement("div"); item.className = "queue-item";
    item.innerHTML = itemHTML(t.art || albumCover(t.album), t.title, t.artist);
    item.addEventListener("click", () => { queue.splice(i, 1); loadTrack(t.id, true); renderQueue(); });
    const rm = document.createElement("button"); rm.className = "circle-btn"; rm.textContent = "×";
    rm.addEventListener("click", e => { e.stopPropagation(); queue.splice(i, 1); renderQueue(); });
    item.appendChild(rm); ui.appendChild(item);
  });
}

/* ---------- PLAYBACK ---------- */
function loadTrack(id, autoplay) {
  const t = tracks.find(x => x.id === id); if (!t) return;
  curId = id;
  audio.src = URL.createObjectURL(t.file);
  $("track-title").innerText = t.title;
  $("track-artist").innerText = t.artist;
  const img = $("track-art-img");
  const art = t.art || albumCover(t.album);
  if (art) { img.src = art; img.style.display = "block"; $("fallback-art").style.display = "none"; }
  else { img.style.display = "none"; $("fallback-art").style.display = "block"; }
  progressCtrl.setValue(0);
  $("current-time").innerText = "0:00"; $("total-duration").innerText = "0:00";
  playBtn.innerHTML = playIconSvg;
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: t.album,
      artwork: t.art ? [{ src: t.art, sizes: "512x512" }] : [] });
  }
  renderPlaylist();
  if (autoplay) playTrack();
}
function playTrack() { audio.play().then(() => { playBtn.innerHTML = pauseIconSvg; }).catch(() => {}); }
function pauseTrack() { audio.pause(); playBtn.innerHTML = playIconSvg; }
function playNext() {
  if (queue.length) { const id = queue.shift(); renderQueue(); loadTrack(id, true); return; }
  let list = contextList(); let i = list.findIndex(t => t.id === curId);
  if (i === -1) { list = tracks; i = list.findIndex(t => t.id === curId); }
  if (list.length) loadTrack(list[(i + 1) % list.length].id, true);
}
function playPrev() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  let list = contextList(); let i = list.findIndex(t => t.id === curId);
  if (i === -1) { list = tracks; i = list.findIndex(t => t.id === curId); }
  if (list.length) loadTrack(list[(i - 1 + list.length) % list.length].id, true);
}
const fmt = s => isFinite(s) ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0") : "0:00";
audio.addEventListener("timeupdate", () => {
  if (!isFinite(audio.duration)) return;
  progressCtrl.setValue(audio.currentTime / audio.duration);
  $("current-time").innerText = fmt(audio.currentTime);
});
audio.addEventListener("loadedmetadata", () => { $("total-duration").innerText = fmt(audio.duration); });
audio.addEventListener("ended", playNext);
playBtn.addEventListener("click", () => audio.paused ? playTrack() : pauseTrack());
$("skip-btn").addEventListener("click", playNext);
if ("mediaSession" in navigator) {
  const m = navigator.mediaSession;
  m.setActionHandler("play", playTrack); m.setActionHandler("pause", pauseTrack);
  m.setActionHandler("nexttrack", playNext); m.setActionHandler("previoustrack", playPrev);
}

/* ---------- TABS ---------- */
const btnQueue = $("btn-queue"), btnPlaylist = $("btn-playlist"), drawerBox = $("drawer-box");
const queueWrapper = $("queue-wrapper"), playlistWrapper = $("playlist-wrapper"), albumsGridWrapper = $("albums-grid-wrapper");
$("back-to-grid-btn").addEventListener("click", () => { playlistWrapper.style.display = "none"; albumsGridWrapper.style.display = "block"; });
function toggleTab(btn) {
  if (btn.classList.contains("active")) {
    btn.classList.remove("active"); drawerBox.classList.remove("expanded");
    setTimeout(() => { if (!drawerBox.classList.contains("expanded")) { queueWrapper.style.display = playlistWrapper.style.display = albumsGridWrapper.style.display = "none"; } }, 400);
    return;
  }
  btnQueue.classList.remove("active"); btnPlaylist.classList.remove("active"); btn.classList.add("active");
  if (btn === btnPlaylist) { albumsGridWrapper.style.display = "block"; playlistWrapper.style.display = "none"; queueWrapper.style.display = "none"; renderAlbums(); }
  else { queueWrapper.style.display = "block"; albumsGridWrapper.style.display = "none"; playlistWrapper.style.display = "none"; renderQueue(); }
  drawerBox.classList.add("expanded");
}
btnQueue.addEventListener("click", () => toggleTab(btnQueue));
btnPlaylist.addEventListener("click", () => toggleTab(btnPlaylist));
</script>
</body>
