<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Player">
<meta name="theme-color" content="#0b1d24">
<title>Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --glass-bg:rgba(255,255,255,.03);--glass-bg-hover:rgba(255,255,255,.08);
  --glass-border:rgba(255,255,255,.12);--glass-border-top:rgba(255,255,255,.4);
  --glass-blur:blur(25px) saturate(180%);
  --glass-shadow:0 20px 50px rgba(0,0,0,.3),0 4px 15px rgba(0,0,0,.15),inset 0 0 2px rgba(255,255,255,.2);
}
*{-webkit-tap-highlight-color:transparent}
html{height:calc(100% + 120px);background-color:#0b1d24;background-repeat:no-repeat}
body{height:100%}
body{margin:0;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 0;box-sizing:border-box;-webkit-text-size-adjust:100%}
.bg-container{position:fixed;top:0;left:0;right:0;height:calc(100% + 120px);z-index:-2;background-size:cover;background-position:center;transition:background .3s ease}
.bg-vignette{position:fixed;top:0;left:0;right:0;height:calc(100% + 120px);background:radial-gradient(circle at center,rgba(0,0,0,0) 30%,rgba(0,0,0,.6) 100%);pointer-events:none;z-index:-1}

.player-wrapper{position:relative;width:100%;max-width:580px;background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);border-top:1px solid var(--glass-border-top);border-radius:24px;padding:20px;box-sizing:border-box;box-shadow:var(--glass-shadow);
  display:flex;flex-direction:column;gap:16px;z-index:1}
.player-wrapper::before{content:'';position:absolute;inset:0;border-radius:24px;pointer-events:none;z-index:2;
  background:linear-gradient(135deg,rgba(255,255,255,.25) 0%,rgba(255,255,255,.05) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 100%)}

.drop-zone{border:1px dashed rgba(255,255,255,.2);border-radius:16px;padding:30px;text-align:center;color:rgba(255,255,255,.6);font-size:14px;cursor:pointer;background:rgba(255,255,255,.02)}
.drop-zone:active{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.4);color:#fff}

.albums-grid-container{max-height:240px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.albums-grid-container::-webkit-scrollbar{display:none}
.albums-grid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:10px;align-items:start}
.album-card{position:relative;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;width:100%;min-width:0;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.album-card img,.album-card .all-tracks-icon{display:block;width:100%;max-width:100%;height:auto;min-width:0;aspect-ratio:1/1;border-radius:12px;border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 15px rgba(0,0,0,.3);object-fit:cover;transition:transform .2s ease;box-sizing:border-box}
.album-card img{pointer-events:none;-webkit-user-drag:none}
.album-card.lifted{z-index:20}
.album-card.lifted img,.album-card.lifted .all-tracks-icon{box-shadow:0 20px 34px rgba(0,0,0,.55)}
.album-card:active img,.album-card:active .all-tracks-icon{transform:scale(.96)}
.album-card .all-tracks-icon{background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}
.album-card .all-tracks-icon svg{width:40px;height:40px;fill:rgba(255,255,255,.4)}
.album-card-title{width:100%;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.8)}

.track-info-container{display:flex;align-items:center;gap:16px;padding:2px var(--inset)}
.album-art{width:64px;height:64px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;box-shadow:0 5px 15px rgba(0,0,0,.3)}
.album-art img{width:100%;height:100%;object-fit:cover}
.album-art svg{width:24px;height:24px;fill:rgba(255,255,255,.4)}
.track-text{display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden;flex:1}
.track-title{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 5px rgba(0,0,0,.5)}
.track-artist{cursor:pointer;font-size:13px;color:rgba(255,255,255,.6);text-shadow:0 1px 3px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.track-artist::after{content:' ›';opacity:.5}
.progress-container{display:flex;align-items:center;flex-wrap:nowrap;gap:10px;font-size:11px;color:rgba(255,255,255,.7);width:100%;padding:0 var(--inset);box-sizing:border-box;font-variant-numeric:tabular-nums}
.controls-cluster{display:flex;align-items:center;gap:6px}
.controls-cluster .player-btn{width:34px;height:34px}
#play-btn{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.artist-row{display:flex;align-items:center;min-width:0}
.artist-row .track-artist{min-width:0;flex:0 1 auto}
.shuf-ind{flex-shrink:0;width:0;height:13px;margin-left:0;opacity:0;fill:#fff;transition:width .3s var(--ease),margin .3s var(--ease),opacity .3s var(--ease)}
.shuf-ind.on{width:13px;margin-left:6px;opacity:.85}
.player-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 5px rgba(0,0,0,.2);padding:0}
.player-btn:active{background:rgba(255,255,255,.25);transform:scale(.94)}
.player-btn svg{width:14px;height:14px;fill:currentColor}

.custom-range-slider{position:relative;height:4px;background:rgba(255,255,255,.15);border-radius:2px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
.custom-range-slider::before{content:'';position:absolute;inset:-16px 0}
.slider-fill{position:absolute;left:0;top:0;height:100%;background:#fff;border-radius:2px;width:0%;box-shadow:0 0 8px rgba(255,255,255,.5)}
.slider-thumb{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transform:translate(-50%,-50%);left:0%}
#progress-slider{flex:1;min-width:0}

.player-footer{position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 var(--inset)}
.tab-buttons{transition:opacity .3s var(--ease),transform .3s var(--ease)}
.player-footer.edit .tab-buttons{opacity:0;transform:translateY(4px);pointer-events:none}
.done-btn{position:absolute;right:var(--inset);top:50%;margin-top:-15px;height:30px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.22);border-top-color:rgba(255,255,255,.4);
  background:rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font:600 11px -apple-system,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.6px;cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.25),inset 0 0 2px rgba(255,255,255,.25);opacity:0;transform:translateY(-4px) scale(.92);pointer-events:none}
.done-btn:active{background:rgba(255,255,255,.26)}
.player-footer.edit .done-btn{opacity:1;transform:none;pointer-events:auto;transition-delay:.06s}
.tab-buttons{display:flex;gap:16px}
.tab-btn{font:600 11px -apple-system,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.4);background:none;border:none;cursor:pointer;padding:10px 0}
.tab-btn.active{color:#fff;text-shadow:0 0 10px rgba(255,255,255,.3)}
.add-btn{color:rgba(255,255,255,.7)}

.collapsible-content{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows var(--dur) var(--ease),opacity .28s ease}
.collapsible-content.expanded{grid-template-rows:1fr;opacity:1}
.drawer-inner{min-height:0;overflow:hidden}
#view-host{box-sizing:border-box;overflow:hidden;border-top:1px solid rgba(255,255,255,.1);padding-top:14px;transition:height var(--dur) var(--ease)}

.back-btn{display:flex;align-items:center;gap:8px;font:600 12px -apple-system,system-ui,sans-serif;color:rgba(255,255,255,.6);background:none;border:none;cursor:pointer;padding:8px 12px;margin-bottom:4px;border-radius:12px}
.back-btn:active{color:#fff;background:rgba(255,255,255,.05)}
.back-btn svg{width:14px;height:14px;fill:currentColor}

.scroll-container-wrapper{position:relative;max-height:280px;padding-bottom:10px}
.playlist-container,.queue-container{max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.playlist-container::-webkit-scrollbar,.queue-container::-webkit-scrollbar{display:none}

.playlist-item,.queue-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:12px;cursor:pointer;gap:10px}
.playlist-item:active,.queue-item:active{background:rgba(255,255,255,.08)}
.playlist-item.missing{opacity:.35;cursor:default}
.playlist-item.missing:active{background:none}
.playlist-item.active{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.1)}
.item-art{width:28px;height:28px;border-radius:6px;background:rgba(255,255,255,.05);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.1)}
.item-art img{width:100%;height:100%;object-fit:cover}
.item-art svg{width:12px;height:12px;fill:rgba(255,255,255,.3)}
.item-text{flex:1;display:flex;flex-direction:column;overflow:hidden}
.item-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-artist{font-size:11px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.circle-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.circle-btn.success{background:#2ecc71;border-color:#2ecc71}

.album-card img{background:rgba(255,255,255,.06)}
.gear-btn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);right:20px;width:42px;height:42px;background:rgba(15,23,30,.4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:11;opacity:.75}
.gear-btn svg{width:18px;height:18px;fill:rgba(255,255,255,.8)}
.floating-customizer{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);right:20px;width:min(280px,calc(100% - 40px));background:rgba(15,23,30,.65);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);
  border:1px solid rgba(255,255,255,.12);border-top:1px solid rgba(255,255,255,.3);border-radius:16px;padding:14px;box-sizing:border-box;box-shadow:0 15px 35px rgba(0,0,0,.4);z-index:10;display:flex;flex-direction:column;gap:12px;
  opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .2s ease,transform .2s ease}
.floating-customizer.active{opacity:1;pointer-events:auto;transform:none}
.wallpaper-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wall-thumb{height:36px;border-radius:8px;cursor:pointer;border:1px solid rgba(255,255,255,.15);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:14px}
.wall-thumb.active{border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,.3)}
.upload-btn{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#fff;font:600 13px -apple-system,system-ui,sans-serif;cursor:pointer}
.upload-btn:active{background:rgba(255,255,255,.22)}
.upload-btn.ghost{background:none;border-color:transparent;color:rgba(255,255,255,.6);font-weight:500;padding:6px}
.track-artist{cursor:pointer}
#track-artist::after{content:" ›";opacity:.5}

.artist-scroll{max-height:450px;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:12px}
.artist-scroll::-webkit-scrollbar{display:none}
.artist-hero{position:relative;height:170px;border-radius:18px;background:#0f2a35;overflow:hidden;clip-path:inset(0 round 18px);isolation:isolate}
.artist-hero-img{position:absolute;inset:0;background-size:cover;background-position:center 25%;z-index:0}
.artist-hero-fade{position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,0) 62%)}
.artist-name{z-index:2;position:absolute;left:16px;right:16px;bottom:12px;font-size:26px;font-weight:700;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.artist-meta{font-size:12px;color:rgba(255,255,255,.6);margin:12px 4px 0}
.artist-note{font-size:12px;color:rgba(255,255,255,.45);margin:10px 4px}
.artist-bio{font-size:13px;line-height:1.45;color:rgba(255,255,255,.82);margin:10px 4px 0}
.artist-bio.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.artist-more{background:none;border:0;color:rgba(255,255,255,.6);font:600 12px -apple-system,system-ui,sans-serif;padding:8px 4px;cursor:pointer}
.artist-sec{font:600 11px -apple-system,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.5);margin:14px 4px 0}
.artist-albums{padding:10px 4px}
.album-card{transition:opacity .4s var(--ease)}
.album-card.dim{opacity:.4;--o:.4}
.album-card .year{font-size:10px;color:rgba(255,255,255,.5);margin-top:-4px}
.own-dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#2ecc71;box-shadow:0 0 8px #2ecc71;z-index:2}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 4px}
.chip{padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);font-size:12px;cursor:pointer}
.chip:active{background:rgba(255,255,255,.22)}
.artist-card img,.artist-card .all-tracks-icon{border-radius:50%!important}
.disc-h{font:600 11px -apple-system,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.5);padding:12px 12px 4px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%) translateY(10px);background:rgba(15,23,30,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);padding:10px 16px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.slider-setting{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.6)}
.slider-setting input{width:130px}

.del-badge{position:absolute;top:-7px;left:-7px;z-index:6;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(12px) saturate(160%);-webkit-backdrop-filter:blur(12px) saturate(160%);
  border:1px solid rgba(255,255,255,.4);box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 2px rgba(255,255,255,.3);cursor:pointer;
  opacity:0;transform:scale(.3);pointer-events:none;transition:opacity .28s var(--ease),transform .38s var(--ease),background .2s var(--ease)}
.del-badge::before{content:'';position:absolute;left:50%;top:50%;width:10px;height:2px;margin:-1px 0 0 -5px;border-radius:1px;background:#fff}
.del-badge:active{background:rgba(255,255,255,.38)}
.albums-grid.editing .del-badge{opacity:1;transform:none;pointer-events:auto;transition-delay:calc(var(--j,0) * 22ms)}
.hidden-toggle{display:flex;align-items:center;justify-content:center;gap:6px;align-self:flex-start;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;color:#fff;padding:8px 12px;cursor:pointer;font:600 12px -apple-system,system-ui,sans-serif}
.hidden-toggle svg{width:18px;height:18px;fill:rgba(255,255,255,.85)}
.hidden-list{max-height:190px;overflow-y:auto;scrollbar-width:none}
.hidden-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.hidden-row .item-art{width:34px;height:34px}
.hidden-row .nm{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidden-row button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:6px 10px;font:600 11px -apple-system,system-ui,sans-serif;cursor:pointer}
.hidden-empty{font-size:12px;color:rgba(255,255,255,.45);text-align:center;padding:10px}
:root{--ease:cubic-bezier(.22,1,.36,1);--dur:.4s}
@keyframes viewIn{from{opacity:0;transform:translate(var(--dx,0),var(--dy,0))}to{opacity:1;transform:none}}
.v-in{animation:viewIn .34s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:var(--o,1);transform:none}}
.card-in{animation:cardIn .36s var(--ease) backwards}
.player-btn,.tab-btn,.chip,.circle-btn,.upload-btn,.back-btn,.hidden-toggle,.done-btn{transition:background .22s var(--ease),color .22s var(--ease),transform .18s var(--ease),border-color .22s var(--ease),opacity .22s var(--ease)}
.playlist-item,.queue-item,.hidden-row{transition:background .22s var(--ease),opacity .3s var(--ease)}
.album-card img,.album-card .all-tracks-icon{transition:transform .28s var(--ease),opacity .3s ease,box-shadow .28s var(--ease)}
#track-art-img{transition:opacity .3s ease}
.floating-customizer{transition:opacity .26s var(--ease),transform .3s var(--ease)!important}
.toast{transition:opacity .28s var(--ease),transform .32s var(--ease)!important}
.albums-grid.editing .album-card[data-key]:not(.lifted)>img,.albums-grid.editing .album-card[data-key]:not(.lifted)>.all-tracks-icon{animation:jig .34s ease-in-out infinite alternate;animation-delay:calc(var(--j,0) * -.13s)}
@keyframes jig{0%{transform:rotate(-.9deg)}100%{transform:rotate(.9deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== one idea: clear glass + the cover's own glow. Tilt only moves that glow (and the wallpaper a hair). ===== */
:root{--inset:10px;--glass-blur:blur(3px) saturate(150%) brightness(.92);--cw:114px;--art-x:24px}   /* --cw = prev+play+next width (3x34 + 2x6); cover (66px) is centred over that group */
.player-wrapper{background:linear-gradient(rgba(6,18,26,.13),rgba(6,18,26,.13)),var(--glass-bg)}
.bg-container{transform:translate3d(calc(var(--tx,0) * -6px),calc(var(--ty,0) * -6px),0) scale(1.04);will-change:transform}
/* corner highlight: fixed size (px), so it no longer grows when the drawer opens; no tilt */
.player-wrapper::before{background:linear-gradient(135deg,rgba(255,255,255,.17) 0,rgba(255,255,255,.04) 90px,rgba(255,255,255,0) 170px)}
.player-wrapper::after{content:none}
.track-info-container{position:relative;align-items:center}
.album-art{width:66px;height:66px;box-sizing:border-box;border-radius:12px;margin-left:var(--art-x);position:relative;z-index:1}
.art-bloom{position:absolute;left:calc(var(--inset) + var(--art-x));top:2px;width:66px;height:66px;border-radius:12px;background-size:cover;background-position:center;
  filter:blur(20px) saturate(1.6);opacity:calc(.38 + var(--pulse,0) * .24);
  transform:translate3d(calc(var(--tx,0) * 12px),calc(var(--ty,0) * 12px),0) scale(calc(1.5 + var(--pulse,0) * .12));pointer-events:none}
/* every album cover gets a quiet static glow taken from its own artwork */
.album-card{isolation:isolate}
/* progress dot glows with the music */
.slider-thumb{box-shadow:0 2px 6px rgba(0,0,0,.4),0 0 calc(8px + var(--pulse,0) * 10px) calc(1px + var(--pulse,0) * 2px) rgba(255,255,255,calc(.5 + var(--pulse,0) * .3))}
/* glow was cut off by the scroll/drawer boxes: give it room inside them (layout stays put via matching negative margins) */
@supports (overflow:clip){.drawer-inner,#view-host{overflow-x:visible;overflow-y:clip}}
.albums-grid-container,.artist-scroll{margin:-14px -20px 0;padding-inline:20px;padding-top:14px}
.artist-scroll{padding-bottom:28px}
.albums-grid{padding-bottom:24px}

/* ===== glow layer: glows live outside the scrollers, are positioned by JS, and fade at the scroller's edges ===== */
#glow-layer{position:absolute;left:0;right:0;top:0;height:0;overflow:hidden;z-index:-1;pointer-events:none;opacity:0;transition:opacity .3s var(--ease);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%)}
#glow-layer.on{opacity:1}
#glow-layer.off .glow{opacity:0!important}
.glow{position:absolute;left:0;top:0;border-radius:14px;background-size:cover;background-position:center;filter:blur(15px) saturate(1.5);opacity:0;transition:opacity .4s var(--ease);will-change:transform}
.glow.in{opacity:.4}
.glow.in.dim{opacity:.16}
.glow.in.live{opacity:calc(.5 + var(--pulse,0) * .35);transition:none}
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const LASTFM_API_KEY = "dbe9aea2d4e59436f4b2015d1f0e027a";
const albumMeta = {};
let tracks = [], queue = [], curId = null, uid = 0;
let currentAlbum = "All Tracks";

const audio = $("audio-element"), playBtn = $("play-btn");
const playIconSvg = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
const pauseIconSvg = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
const noteSvg = `<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- HOME SCREEN ICON ---------- */
(function () {
  try {
    const c = document.createElement("canvas"); c.width = c.height = 180;
    const x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 180, 180);
    g.addColorStop(0, "#1d4e5f"); g.addColorStop(1, "#0b1d24");
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.fillStyle = "#fff"; x.beginPath(); x.ellipse(66, 128, 24, 18, -0.35, 0, 7); x.fill();
    x.fillRect(84, 44, 12, 84); x.beginPath(); x.moveTo(96, 44); x.quadraticCurveTo(140, 56, 132, 96); x.lineTo(120, 92); x.quadraticCurveTo(122, 70, 96, 64); x.fill();
    const l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = c.toDataURL("image/png");
    document.head.appendChild(l);
  } catch (e) {}
})();

/* ---------- WALLPAPER ---------- */
const DEFAULT_WALL = "https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?auto=format&fit=crop&w=2400&q=75";
const FALLBACK_BG = "linear-gradient(160deg,#0b1d24,#1d4e5f 60%,#0b1d24)";
const mainBg = $("main-bg");
function applyBg() {
  mainBg.style.filter = `blur(${store.get("wallpaperBlur") || 0}px)`;
  const custom = store.get("photoData");
  mainBg.style.backgroundImage = `url('${custom || DEFAULT_WALL}'), ${FALLBACK_BG}`;
  const pos = custom ? "center" : "70% 24%";
  mainBg.style.backgroundPosition = `${pos}, center`;
  // Same wallpaper painted on the page canvas itself, so it also fills the strip under Safari's bar
  const root = document.documentElement.style, vig = "radial-gradient(circle at center,rgba(0,0,0,0) 30%,rgba(0,0,0,.6) 100%)";
  root.backgroundImage = `${vig}, url('${custom || DEFAULT_WALL}'), ${FALLBACK_BG}`;
  root.backgroundSize = "100% 100%, cover, cover";
  root.backgroundPosition = `center, ${pos}, center`;
}
$("upload-wall").addEventListener("click", () => $("photo-input").click());
$("reset-wall").addEventListener("click", () => { store.set("photoData", ""); applyBg(); });
$("photo-input").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(), u = URL.createObjectURL(f);
  img.onload = () => {
    const sc = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = img.width * sc; c.height = img.height * sc;
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    store.set("photoData", c.toDataURL("image/jpeg", .82));
    URL.revokeObjectURL(u); applyBg();
  };
  img.src = u; e.target.value = "";
});
const blurSlider = $("blur-slider");
blurSlider.value = store.get("wallpaperBlur") || "0";
blurSlider.addEventListener("input", e => { store.set("wallpaperBlur", e.target.value); applyBg(); });
const gearBtn = $("gear-trigger"), settingsPanel = $("settings-panel");
gearBtn.addEventListener("click", () => settingsPanel.classList.toggle("active"));
document.addEventListener("click", e => {
  if (!settingsPanel.contains(e.target) && !gearBtn.contains(e.target)) settingsPanel.classList.remove("active");
});
applyBg();

/* ---------- SLIDER (mouse + touch) ---------- */
function setupCustomSlider(id, cb) {
  const slider = $(id), fill = slider.querySelector(".slider-fill"), thumb = slider.querySelector(".slider-thumb");
  let dragging = false;
  const visual = p => { p = Math.max(0, Math.min(100, p)); fill.style.width = p + "%"; thumb.style.left = p + "%"; };
  const handle = e => { const r = slider.getBoundingClientRect(); const p = (e.clientX - r.left) / r.width * 100; visual(p); cb(Math.max(0, Math.min(1, p / 100))); };
  slider.addEventListener("pointerdown", e => { dragging = true; slider.setPointerCapture(e.pointerId); handle(e); });
  slider.addEventListener("pointermove", e => { if (dragging) handle(e); });
  const end = () => { dragging = false; };
  slider.addEventListener("pointerup", end); slider.addEventListener("pointercancel", end);
  return { setValue: v => { if (!dragging) visual(v * 100); } };
}
const progressCtrl = setupCustomSlider("progress-slider", v => { if (isFinite(audio.duration)) audio.currentTime = v * audio.duration; });

/* ---------- LOADING SONGS ---------- */
$("drop-zone").addEventListener("click", () => $("file-input").click());
$("btn-add").addEventListener("click", () => $("file-input").click());
$("file-input").addEventListener("change", async e => {
  const files = Array.from(e.target.files); e.target.value = "";
  if (!files.length) return;
  $("drop-zone").style.display = "none";
  $("player-main").style.display = "flex";
  $("controls-main").style.display = "flex";
  $("footer-main").style.display = "flex";
  dupCount = 0;
  for (const f of files) await addFile(f);
  renderAlbums(); renderPlaylist();
  if (dupCount) toast(`Skipped ${dupCount} duplicate${dupCount > 1 ? "s" : ""}`);
});
function readTags(f) {
  return new Promise(res => {
    if (!window.jsmediatags) return res({});
    try { jsmediatags.read(f, { onSuccess: t => res(t.tags || {}), onError: () => res({}) }); } catch (e) { res({}); }
  });
}
const fileKeys = new Set(), tagKeys = new Set(); let dupCount = 0;
let toastTimer;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600); }
const cmpTracks = (a, b) => a.album.localeCompare(b.album) || (a.disc || 1) - (b.disc || 1) || (a.num || 1e6) - (b.num || 1e6) || a.title.localeCompare(b.title);
const tagText = fr => (fr && fr.data != null ? String(fr.data) : "");
function parseDisc(t) {
  let v = null;
  if (t.TPOS && t.TPOS.data != null) v = t.TPOS.data;
  else if (t.disk && t.disk.data != null) v = typeof t.disk.data === "object" ? t.disk.data.disk : t.disk.data;
  const n = parseInt(v, 10); return n > 0 ? n : 0;
}
async function addFile(f) {
  const fk = `${f.name}|${f.size}|${f.lastModified}`;
  if (fileKeys.has(fk)) { dupCount++; return; }                       // same file picked again
  const t = await readTags(f);
  const stem = f.name.replace(/\.[^.]+$/, "").replace(/^\s*\d{1,3}\s*[-._)]\s*/, "");
  let title0 = t.title || stem;
  const sub3 = tagText(t.TIT3).trim();                                        // ID3 "subtitle" frame, e.g. "Live"
  if (sub3 && !title0.toLowerCase().includes(sub3.toLowerCase())) title0 += ` (${sub3})`;
  const fstem = stem.replace(/^[^-:]{1,40}\s*[-:]\s*/, m => norm(m).startsWith(norm(String(t.artist || "~"))) ? "" : m);
  if (t.title && fstem.length > t.title.length && fstem.toLowerCase().startsWith(t.title.toLowerCase()) && /^\s*[\(\[]/.test(fstem.slice(t.title.length))) title0 = fstem; // file name carries the version suffix
  const cl = x => String(x == null ? "" : x).replace(/\0/g, "").trim();
  const tr = { id: ++uid, title: cl(title0), discName: cl(tagText(t.TSST)), artist: cl(t.artist) || "Unknown Artist", isrc: cl(tagText(t.TSRC)),
    album: cl(t.album) || "Unknown Album", albumArtist: cl(tagText(t.TPE2) || tagText(t.aART)),
    disc: parseDisc(t), num: parseInt(t.track, 10) || 0, year: parseInt(t.year, 10) || 0, file: f, art: null };
  const tk = [tr.artist, tr.album, tr.disc, tr.num, tr.title].map(x => String(x).trim().toLowerCase()).join("|");
  fileKeys.add(fk);
  if (tagKeys.has(tk)) { dupCount++; return; }                        // identical track already in this album
  tagKeys.add(tk);
  if (t.picture) { try { tr.art = URL.createObjectURL(new Blob([new Uint8Array(t.picture.data)], { type: t.picture.format || "image/jpeg" })); } catch (e) {} }
  tracks.push(tr); tracks.sort(cmpTracks);
  scheduleAlbumWork(tr); delete albumRelease[tr.album]; scheduleResolve();
  if (curId === null) loadTrack(tr.id, false);
}
const norm = s => String(s).toLowerCase().replace(/\(.*?\)|\[.*?\]/g, "").replace(/[^a-z0-9]/g, "");
const albumP = {}, albumNotFound = {};
function fetchAlbumMeta(artist, album) {
  if (album === "Unknown Album" || artist === "Unknown Artist") return Promise.resolve(null);
  if (albumP[album]) return albumP[album];
  return albumP[album] = (async () => {
    try {
      const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 8000);
      const url = `https://ws.audioscrobbler.com/2.0/?method=album.getinfo&api_key=${LASTFM_API_KEY}&artist=${encodeURIComponent(artist)}&album=${encodeURIComponent(album)}&format=json`;
      const data = await (await fetch(url, { signal: ctrl.signal })).json(); clearTimeout(to);
      const a = data.album; if (!a) { if (data.error) albumNotFound[album] = true; return null; }
      const img = (a.image || []).slice().reverse().find(i => i["#text"]);
      let list = a.tracks && a.tracks.track ? a.tracks.track : [];
      if (!Array.isArray(list)) list = [list];
      albumMeta[album] = { artist, cover: img ? img["#text"] : null, tracks: list.map(t => t.name) };
      renderAlbums(); renderPlaylist();
      return albumMeta[album];
    } catch (e) { return null; }
  })();
}

/* --- find the track's real album when the file's tag is a playlist/collection --- */
let mbChain = Promise.resolve();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const cleanTitle = s => s.replace(/\s*[\(\[].*?[\)\]]/g, "").replace(/\s-\s.*$/, "").trim();
const mainArtist = s => s.split(/\s*(?:;|,|&|\bfeat\.|\bft\.)\s*/i)[0].trim();
function refreshNowPlaying() {
  const t = tracks.find(x => x.id === curId); if (!t) return;
  const art = t.art || albumCover(t.album), img = $("track-art-img");
  if (art) { img.src = art; img.style.display = "block"; $("fallback-art").style.display = "none"; }
  else { img.style.display = "none"; $("fallback-art").style.display = "block"; }
}
/* --- deleted albums (Trash), persisted ---- */
const hiddenSet = new Set((() => { try { return JSON.parse(store.get("hiddenAlbums") || store.get("trashedAlbums") || "[]"); } catch (e) { return []; } })());
const saveHidden = () => store.set("hiddenAlbums", JSON.stringify([...hiddenSet]));
const albumSeen = new Set();
const isRealAlbum = n => n !== "Unknown Album" && !hiddenSet.has(n);
function scheduleAlbumWork(tr) { if (albumSeen.has(tr.album)) return; albumSeen.add(tr.album); fetchAlbumMeta(tr.artist, tr.album); }

/* --- album identity: base title + live flag (+ artist check), never substring matching --- */
const LIVE_RE = /\b(live|in concert|concert|unplugged|mtv|sessions?)\b/i;
const EDITION_RE = /\b(deluxe|expanded|remaster(?:ed)?|anniversary|edition|bonus|explicit|special|collector'?s?|super|reissue|version|original (?:game |motion picture )?soundtrack|ost|\d{4})\b/i;
function albumSig(title) {
  const t = String(title), live = LIVE_RE.test(t);
  let x = t.replace(/[\(\[][^\)\]]*[\)\]]/g, m => EDITION_RE.test(m) && !LIVE_RE.test(m) ? "" : m)
           .replace(/\s[-–:]\s*[^-–:]*\b(deluxe|remaster(?:ed)?|edition|expanded|anniversary)\b.*$/i, "");
  const b = norm(x); return b ? b + (live ? "#live" : "") : "";
}
let dzChain = Promise.resolve();
function dz(url) {                                   // serialised (Deezer allows ~50 calls / 5 s), retries on quota/network errors
  return new Promise((res, rej) => { dzChain = dzChain.then(async () => {
    for (let i = 0; i < 4; i++) {
      try { const d = await jsonp(url); if (d && d.error) throw new Error("dz"); res(d); await sleep(100); return; }
      catch (e) { if (i === 3) { rej(e); return; } await sleep(900 * (i + 1)); }
    }
  }); });
}
/* --- release identity ---------------------------------------------------------------
   Ownership is per RELEASE (a Deezer album id), never per title. A local album is linked to a
   release only when its actual tracks (titles / disc+number) are found on that release's tracklist.
   Title, year and album name are only used to shortlist candidates and break ties.            */
const relStore = (() => { try { return JSON.parse(store.get("releaseMap2") || "{}"); } catch (e) { return {}; } })();
const relDebug = {}, albumRelease = {}, relTracks = {}, dzCat = {};      // local album -> release id | 0 ; id -> tracklist ; artist -> catalog
const sn = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
function dzCatalog(name) {
  const k = norm(name);
  return dzCat[k] || (dzCat[k] = (async () => {
    try {
      const r = await dz("https://api.deezer.com/search/artist?limit=10&q=" + enc(name));
      const hit = (r.data || []).filter(x => norm(x.name) === k).sort((a, b) => (b.nb_fan || 0) - (a.nb_fan || 0))[0];
      if (!r.data) throw new Error("dz");
      if (!hit) return { id: null, albums: [] };
      let all = [];

    mb.addEventListener("click", () => D.requestPermission().then(r => { if (r === "granted") { mb.style.display = "none"; toast("Tilt effect on"); } }).catch(() => {}));
  }
  addEventListener("pointermove", e => { if (e.pointerType === "mouse") { tx = (e.clientX / innerWidth - .5) * 2; ty = (e.clientY / innerHeight - .5) * 2; go(); } });
})();

/* bloom follows whatever cover is showing */
(function () {
  const bloom = $("art-bloom"), img = $("track-art-img");
  function sync() { const src = img.style.display !== "none" && img.getAttribute("src"); bloom.style.backgroundImage = src ? `url("${src}")` : ""; bloom.style.opacity = src ? "" : "0"; }
  new MutationObserver(sync).observe(img, { attributes: true, attributeFilter: ["src", "style"] }); sync();
})();

/* ---------- music-reactive glow ----------
   The track is decoded once, offline, into a smooth loudness+bass envelope (30/frames per second).
   The glow then just reads that envelope at audio.currentTime, so playback is never routed through Web Audio. */
const envCache = new Map(); let env = null, envId = null, pulse = 0, pRaf = 0;
const pulseEls = () => [$("art-bloom"), $("glow-layer"), $("progress-slider").querySelector(".slider-thumb")];
function envelope(ab) {
  const chs = []; for (let c = 0; c < ab.numberOfChannels; c++) chs.push(ab.getChannelData(c));
  const N = ab.length, hop = Math.round(ab.sampleRate / 30), F = Math.floor(N / hop), nc = chs.length;
  const full = new Float32Array(F), bass = new Float32Array(F), al = 1 - Math.exp(-2 * Math.PI * 150 / ab.sampleRate); let lp = 0;
  for (let f = 0; f < F; f++) {
    let sf = 0, sb = 0;
    for (let i = f * hop, e = i + hop; i < e; i++) { let x = 0; for (let c = 0; c < nc; c++) x += chs[c][i]; x /= nc; lp += al * (x - lp); sf += x * x; sb += lp * lp; }
    full[f] = Math.sqrt(sf / hop); bass[f] = Math.sqrt(sb / hop);
  }
  const nz = a => { const t = Float32Array.from(a).sort(), lo = t[Math.floor(F * .05)], hi = t[Math.floor(F * .97)], d = hi - lo || 1; return a.map(v => Math.max(0, Math.min(1, (v - lo) / d))); };
  const b = nz(bass), fl = nz(full), m = new Float32Array(F);
  for (let f = 0; f < F; f++) m[f] = .55 * b[f] + .45 * fl[f];
  const out = new Float32Array(F);                                   // ~170 ms moving average: no jitter
  for (let f = 0; f < F; f++) { let s = 0, n = 0; for (let k = -3; k <= 3; k++) { const v = m[f + k]; if (v !== undefined) { s += v; n++; } } out[f] = s / n; }
  return out;
}
async function analyze(t) {
  env = null; envId = t.id;
  if (envCache.has(t.id)) { env = envCache.get(t.id); return; }
  try {
    if (t.file.size > 80e6) return;
    const buf = await t.file.arrayBuffer(), OC = window.OfflineAudioContext || window.webkitOfflineAudioContext, ctx = new OC(1, 1, 22050);
    const ab = await new Promise((res, rej) => { const r = ctx.decodeAudioData(buf, res, rej); if (r && r.then) r.then(res, rej); });
    const e = envelope(ab); envCache.set(t.id, e); if (envId === t.id) env = e;
  } catch (err) {}                                                   // no envelope -> the glow just breathes slowly
}
function startPulse() { if (!pRaf && !matchMedia("(prefers-reduced-motion:reduce)").matches) pRaf = requestAnimationFrame(pulseLoop); }
function pulseLoop() {
  pRaf = 0;
  const playing = !audio.paused && !document.hidden; let target = 0;
  if (playing) {
    if (env) target = env[Math.min(env.length - 1, Math.max(0, Math.floor(audio.currentTime * 30)))];
    else target = .4 + .15 * Math.sin(performance.now() / 1500);
  }
  const nv = pulse + (target - pulse) * (target > pulse ? .14 : .04);   // quick-ish rise, slow fall
  if (Math.abs(nv - pulse) > .0015) { pulse = nv; const v = pulse.toFixed(3); pulseEls().forEach(el => el && el.style.setProperty("--pulse", v)); }
  if (playing || pulse > .01) pRaf = requestAnimationFrame(pulseLoop);
}
audio.addEventListener("pause", startPulse);                          // lets the glow settle back down
document.addEventListener("visibilitychange", () => { if (!document.hidden) startPulse(); });
/* ---------- glow layer ----------
   One layer behind the drawer content, not inside any scroller. Each cover's glow is positioned from the
   cover's on-screen rect every frame (only while the drawer is open), so it can spill past the scroller's edge
   and is faded there by the layer's mask, while the covers themselves stay clipped by their scroller. */
(function () {
  const layer = $("glow-layer"), inner = document.querySelector(".drawer-inner"), wrap = document.querySelector(".player-wrapper"), M = 22;
  const map = new Map(); let raf = 0, stopAt = 0;
  function frame() {
    raf = 0;
    const open = drawerBox.classList.contains("expanded");
    if (!open && performance.now() > stopAt) { layer.classList.remove("on"); map.forEach(g => g.remove()); map.clear(); return; }
    // reads
    const wr = wrap.getBoundingClientRect(), di = inner.getBoundingClientRect();
    const cs = [...viewHost.querySelectorAll('.album-card[style*="--art"]')].filter(c => c.offsetParent);
    const rects = cs.map(c => c.getBoundingClientRect());
    const sc = cs.length && cs[0].closest(".albums-grid-container,.artist-scroll"), sr = sc ? sc.getBoundingClientRect() : di;
    const rt = Math.max(sr.top, di.top), rb = Math.max(rt, Math.min(sr.bottom, di.bottom)), H = rb - rt + 2 * M;
    const cur = tracks.find(t => t.id === curId), curAlbum = cur && cur.album;
    // writes
    layer.classList.toggle("on", open); layer.classList.toggle("off", editing);
    layer.style.top = (rt - wr.top - 1 - M) + "px"; layer.style.height = H + "px";
    const seen = new Set();
    cs.forEach((c, i) => {
      let g = map.get(c);
      if (!g) {
        const m = /url\("(.*)"\)/.exec(c.style.getPropertyValue("--art")); if (!m) return;
        g = document.createElement("div"); g.className = "glow"; g.style.backgroundImage = `url("${m[1]}")`;
        layer.appendChild(g); map.set(c, g); requestAnimationFrame(() => g.classList.add("in"));
      }
      seen.add(c);
      const r = rects[i], y = r.top - rt + M, vis = y + r.width > -50 && y < H + 50;
      g.style.display = vis ? "" : "none";
      if (vis) { g.style.width = g.style.height = r.width + "px"; g.style.transform = `translate3d(${r.left - wr.left - 1}px,${y}px,0) scale(1.1)`; }
      g.classList.toggle("dim", c.classList.contains("dim"));
      g.classList.toggle("live", !!curAlbum && c.dataset.key === curAlbum);
    });
    map.forEach((g, c) => { if (!seen.has(c)) { g.remove(); map.delete(c); } });
    raf = requestAnimationFrame(frame);
  }
  const kick = ms => { stopAt = Math.max(stopAt, performance.now() + ms); if (!raf) raf = requestAnimationFrame(frame); };
  new MutationObserver(() => kick(900)).observe(drawerBox, { attributes: true, attributeFilter: ["class"] });
  document.addEventListener("visibilitychange", () => kick(900));
})();
</script>
