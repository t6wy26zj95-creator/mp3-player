# The iOS app (for sideloading with AltStore). Xcode project generated from this file by XcodeGen on GitHub's Mac
# build machine: see .github/workflows/ios.yml. The app is native SwiftUI (Macaw/*.swift); it looks like the web player
# (index.html); the web player itself is kept inside too, behind a hidden switch (WebMode.swift).
name: MacawP3
options:
  bundleIdPrefix: app.macaw
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MacawP3:
    type: application
    scheme:
      testTargets:
        - MacawUITests
    platform: iOS
    sources:
      - path: Macaw
        excludes:
          - Info.plist
          - www
      # the hidden web player: index.html (+ the tag reader), copied in by the build (.github/workflows/ios.yml)
      - path: Macaw/www
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.macaw.player
        PRODUCT_NAME: MacawP3
        INFOPLIST_FILE: Macaw/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
  # the build machine's walk through the whole app (screenshots + the speed meter's log); not part of the app
  MacawUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MacawUITests
    dependencies:
      - target: MacawP3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.macaw.player.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MacawP3
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
