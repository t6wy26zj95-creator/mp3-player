# Builds the iOS app (Macaw.ipa) on one of GitHub's Mac computers, for sideloading with AltStore.
# - Every push to main: a new release, "iOS app build N", with Macaw.ipa attached.
#   Always-current download link: https://github.com/<owner>/<repo>/releases/latest/download/Macaw.ipa
# - A push to any other branch (a pull request being tested): the "iOS app preview" pre-release is replaced with that build.
# The .ipa is unsigned on purpose: AltStore signs it with your own Apple ID when it installs it.
name: iOS app

on:
  push:
    paths:
      - index.html
      - ios/**
      - .github/workflows/ios.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Put the player inside the app
        run: |
          mkdir -p ios/Macaw/www
          cp index.html ios/Macaw/www/index.html
          # the tag reader, kept in the app so songs added offline still get their names and covers
          curl -fsSL --retry 3 -o ios/Macaw/www/jsmediatags.min.js https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js \
            || curl -fsSL --retry 3 -o ios/Macaw/www/jsmediatags.min.js https://cdn.jsdelivr.net/gh/aadsm/jsmediatags@v3.9.5/dist/jsmediatags.min.js
          test -s ios/Macaw/www/jsmediatags.min.js

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build
        run: |
          cd ios
          xcodebuild -project Macaw.xcodeproj -scheme Macaw -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="1.0.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 && ok=1 || ok=0
          grep -E 'error:|warning: .*/Macaw/|\*\* BUILD' build.log || true
          [ "$ok" = 1 ] || { tail -100 build.log; exit 1; }

      - name: Pack Macaw.ipa
        run: |
          cd ios
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Macaw.app Payload/
          zip -qry ../Macaw.ipa Payload
          ls -lh ../Macaw.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Macaw-ipa
          path: Macaw.ipa

      - name: Publish (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-${{ github.run_number }}" Macaw.ipa --target "${{ github.sha }}" --latest \
            --title "iOS app build ${{ github.run_number }}" \
            --notes "Download Macaw.ipa below and open it with AltStore. Built from ${{ github.sha }}."

      - name: Publish (preview)
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-preview --cleanup-tag --yes || true
          gh release create ios-preview Macaw.ipa --target "${{ github.sha }}" --prerelease \
            --title "iOS app preview (${{ github.ref_name }})" \
            --notes "Test build from the branch ${{ github.ref_name }}, not merged yet. Download Macaw.ipa below and open it with AltStore."
